<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventos del día - TVArg</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px 0 25px;
        }

        .filtros {
            max-width: 850px;
            margin: 0 auto 25px;
        }

        .filtros label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #252525;
            color: white;
            font-size: 16px;
        }

        #listaEventos {
            max-width: 850px;
            max-height: 55vh;
            margin: auto;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .partido {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #222;
            border: 1px solid #383838;
            border-radius: 5px;
            padding: 6px 10px;
            margin-bottom: 5px;
            min-height: 38px;
        }

        .horario {
            flex: 0 0 48px;
            color: #80cbc4;
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }

        .competencia {
            flex: 0 0 42px;
            color: #80cbc4;
            font-size: 12px;
            margin: 0;
        }

        .nombrePartido {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }

        .btnVer {
            flex: 0 0 auto;
            background: #80cbc4;
            color: #121212;
            padding: 5px 12px;
            font-size: 13px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btnVolver {
            display: block;
            width: 100%;
            max-width: 850px;
            margin: 25px auto 10px;
            background: #383838;
            color: white;
        }

        #mensaje {
            max-width: 850px;
            margin: 25px auto;
            padding: 16px;
            background: #222;
            border-radius: 8px;
            color: #ccc;
            text-align: center;
        }

        #selectorFuentes {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .panelFuentes {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 450px;
            max-height: calc(100vh - 40px);
            background: #222;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 20px;
            overflow: hidden;
        }

        .panelFuentes h2 {
            flex-shrink: 0;
            font-size: 20px;
            margin-top: 0;
        }

        #listaFuentes {
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .fuente {
            display: block;
            width: 100%;
            margin: 10px 0;
            background: #333;
            color: white;
            text-align: left;
        }

        .btnCerrar {
            flex-shrink: 0;
            width: 100%;
            margin-top: 12px;
            background: #555;
            color: white;
        }
    </style>
</head>

<body>

    <h1>⚽ LISTA DE EVENTOS</h1>

    <div class="filtros">
        <label for="filtroCompetencia">
            Competencia
        </label>

        <select id="filtroCompetencia">
            <option value="Todas">Todas las competencias</option>
            <option value="LPF Argentino">LPF Argentino</option>
            <option value="Copa Sudamericana">Copa Sudamericana</option>
            <option value="Copa Libertadores">Copa Libertadores</option>
            <option value="Copa Argentina">Copa Argentina</option>
        </select>
    </div>

    <div id="listaEventos"></div>

    <div id="mensaje" role="status">
        Cargando eventos...
    </div>

    <button class="btnVolver" onclick="volver()">
        VOLVER
    </button>

    <div id="selectorFuentes">
        <div class="panelFuentes">
            <h2>Seleccionar transmisión</h2>

            <div id="listaFuentes"></div>

            <button class="btnCerrar" onclick="cerrarFuentes()">
                CANCELAR
            </button>
        </div>
    </div>

    <!-- Datos de los partidos -->
    <script src="eventos/ultimoseventos.js"></script>

    <script>
        const listaEventos = document.getElementById("listaEventos");
        const mensaje = document.getElementById("mensaje");
        const filtroCompetencia =
            document.getElementById("filtroCompetencia");

        const selectorFuentes =
            document.getElementById("selectorFuentes");

        let eventoSeleccionado = null;
        let fuentesSeleccionadas = [];
        let metodoSeleccionado = null;

        /*
         * Los horarios de ultimoseventos.js deben estar expresados
         * en la hora local de Argentina:
         * America/Argentina/Buenos_Aires.
         *
         * Fecha: AAAA-MM-DD
         * Hora: HH:MM
         */

        function obtenerInicio(evento) {
            if (!evento.fecha || !evento.hora) {
                return null;
            }

            const inicio = new Date(
                evento.fecha + "T" + evento.hora + ":00-03:00"
            );

            return Number.isNaN(inicio.getTime())
                ? null
                : inicio;
        }

        function eventoVigente(evento) {
            return true;
        }

        function mostrarEventos() {
            listaEventos.innerHTML = "";

            const eventos = window.ULTIMOS_EVENTOS;

            if (!Array.isArray(eventos)) {
                mensaje.textContent =
                    "No se pudo cargar eventos/ultimoseventos.js.";
                return;
            }

            const competenciaSeleccionada =
                filtroCompetencia.value;

            const vigentes = eventos
                .filter(evento => eventoVigente(evento))
                .filter(evento =>
                    competenciaSeleccionada === "Todas" ||
                    evento.competencia === competenciaSeleccionada
                )
                .sort((a, b) => {
                    const inicioA = obtenerInicio(a);
                    const inicioB = obtenerInicio(b);

                    if (!inicioA && !inicioB) return 0;
                    if (!inicioA) return 1;
                    if (!inicioB) return -1;

                    return inicioA - inicioB;
                });

            if (vigentes.length === 0) {
                mensaje.textContent =
                    "No hay eventos vigentes para esta selección.";
                return;
            }

            mensaje.textContent =
                "Eventos disponibles: " + vigentes.length;

            vigentes.forEach(evento => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "partido";

                const competencia = document.createElement("div");
                competencia.className = "competencia";
                competencia.textContent = evento.competencia || "";

                const nombre = document.createElement("div");
                nombre.className = "nombrePartido";
                nombre.textContent =
                    evento.nombre || "Partido sin nombre";

                const horario = document.createElement("div");
                horario.className = "horario";
                horario.textContent =
                    "Hoy / " + (evento.hora || "");

                const boton = document.createElement("button");
                boton.className = "btnVer";
                boton.textContent = "VER";
                boton.onclick = () => verEvento(evento);

                tarjeta.appendChild(competencia);
                tarjeta.appendChild(nombre);
                tarjeta.appendChild(horario);
                tarjeta.appendChild(boton);

                listaEventos.appendChild(tarjeta);
            });
        }



function verEvento(evento) {
    const fuentes = Array.isArray(evento.fuentes)
        ? evento.fuentes.filter(f => f && f.url)
        : [];

    if (fuentes.length === 0) {
        alert("Este evento no tiene fuentes de transmisión.");
        return;
    }

    eventoSeleccionado = evento;
    fuentesSeleccionadas = fuentes;
    metodoSeleccionado = null;

    mostrarMetodos();
}


function mostrarMetodos() {
    const contenedor =
        document.getElementById("listaFuentes");

    const titulo =
        document.querySelector(".panelFuentes h2");

    contenedor.innerHTML = "";
    titulo.textContent = "Seleccionar método de reproducción";

    [
        { texto: "PLAYER", modo: "player" },
        { texto: "TS", modo: "ts" },
        { texto: "VLC", modo: "vlc" }
    ].forEach(opcion => {
        const boton = document.createElement("button");
        boton.className = "fuente";
        boton.textContent = opcion.texto;

        boton.onclick = () => {
            metodoSeleccionado = opcion.modo;
            seleccionarFuente(
                eventoSeleccionado,
                fuentesSeleccionadas,
                metodoSeleccionado
            );
        };

        contenedor.appendChild(boton);
    });

    selectorFuentes.style.display = "flex";
}

function seleccionarFuente(evento, fuentes, modo) {
    if (fuentes.length === 1) {
        selectorFuentes.style.display = "none";
        abrirFuente(fuentes[0], modo);
        return;
    }

    const contenedor =
        document.getElementById("listaFuentes");

    const titulo =
        document.querySelector(".panelFuentes h2");

    contenedor.innerHTML = "";

    titulo.textContent =
        "Seleccionar transmisión — " + modo.toUpperCase();

    fuentes.forEach((fuente, indice) => {
        const boton = document.createElement("button");
        boton.className = "fuente";
        boton.textContent =
            fuente.nombre || ("Fuente " + (indice + 1));

        boton.onclick = () => {
            selectorFuentes.style.display = "none";
            abrirFuente(fuente, modo);
        };

        contenedor.appendChild(boton);
    });

    selectorFuentes.style.display = "flex";
}

function cerrarFuentes() {
    if (metodoSeleccionado !== null) {
        mostrarMetodos();
        return;
    }

    selectorFuentes.style.display = "none";
    eventoSeleccionado = null;
    fuentesSeleccionadas = [];
}


function volver() {
    window.location.href = "index.html?desdeTVALC=1";
}

/*
 * Atrás en el control remoto:
 * - En la lista de fuentes: vuelve a elegir el método.
 * - En la selección de método: cierra el selector.
 * - En la lista de eventos: vuelve al menú principal.
 */
window.addEventListener("tvback", function () {
    if (selectorFuentes.style.display === "flex") {
        cerrarFuentes();
    } else {
        volver();
    }
});

/*
 * Permite volver también con teclas de retroceso
 * si el navegador o dispositivo las envía al documento.
 */
window.addEventListener("keydown", function (event) {
    if (
        event.key === "Escape" ||
        event.key === "Backspace" ||
        event.key === "BrowserBack"
    ) {
        event.preventDefault();

        if (selectorFuentes.style.display === "flex") {
            cerrarFuentes();
        } else {
            volver();
        }
    }
});
        filtroCompetencia.addEventListener(
            "change",
            mostrarEventos
        );

        mostrarEventos();

        // Actualiza la lista cada 30 segundos.
        setInterval(mostrarEventos, 30000);

        /*
         * MainActivity llama a esta función al cerrar el reproductor.
         * Se define para evitar errores si el HTML no tiene otra
         * rutina de salida específica.
         */

function manejarSalidaCanal() {
    if (eventoSeleccionado !== null) {
        metodoSeleccionado = null;
        mostrarMetodos();
    }
}

    </script>

</body>
</html>
