    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

#inicioTVArg button span {

function getYouTubeEmbed(url) {

    try {
        const u = new URL(url);

        let id = u.searchParams.get("v");

        // soporte shorts
        if (!id && u.pathname.includes("/shorts/")) {
            id = u.pathname.split("/shorts/")[1];
        }

        if (!id) return null;

        return `https://www.youtube.com/embed/${id}`;

    } catch {
        return null;
    }
}

function reproducirFuenteSeleccionada(item, fuente) {

    // Si este canal/variante sólo tiene una fuente,
    // no existe selector al que volver.
if (item.fuentes && item.fuentes.length === 1) {
    // No existe selector de fuentes
    selectorAbierto = false;
    itemSelectorActual = null;
    // PERO si venimos de variantes,
    // conservamos el selector padre
    if (!canalPadreAnterior) {
        ultimoSelector = null;
    }
}
    varianteAnterior = item;

    console.log(
        "Fuente seleccionada:",
        item.nombre,
        fuente.tipo,
        fuente.url
    );

    iniciarEvaluacionCanal(item, fuente);
    switch (fuente.tipo) {
        case "hls":
            reproducirHls({
                ...item,
                fuentes: [fuente]
            });
            break;
        case "youtube":
            reproducirYoutube(fuente.url);
            break;
        case "web":
            abrirWeb(fuente.url);
            break;
        default:
            console.warn(
                "Tipo de fuente desconocido:",
                fuente.tipo
            );
            break;
    }
}

function obtenerIndicadorEvaluacion(fuente){

    const datos =
        JSON.parse(
            localStorage.getItem("evaluacionesTVArg")
        ) || {};

    const id =
        canalAnterior.nombre +
        "_" +
        fuente.tipo +
        "_" +
        btoa(fuente.url) +
        "_" +
        (fuente.reproductor || "exo");

    const item = datos[id];

    if(!item){
        return "Sin datos";
    }

    const p = item.promedio;

    if(p === 0){
        return "❌";
    }

    if(p > 80){
        return "★★★★★";
    }

    if(p > 65){
        return "★★★★☆";
    }

    if(p > 50){
        return "★★★☆☆";
    }

    if(p > 25){
        return "★★☆☆☆";
    }

    return "★☆☆☆☆";
}

function reproducirHls(canal) {
    estado = "player";
    menu.style.display = "none";
    player.style.display = "flex";
    if (hls) {
        hls.destroy();
        hls = null;
    }
    video.pause();
    video.removeAttribute("src");
    video.load();

    // ==================================
    // NUEVO SISTEMA DE FUENTES
    // ==================================
    canalActual = canal;
    if (!canalActual.fuentes) {
        console.error("Canal sin fuentes");
        return;
    }
    fuenteActual = 0;
    intentosFuente = 0;
    let fuente = canalActual.fuentes[fuenteActual];

    let url = fuente.url;
    let headers = fuente.headers || {};
    console.log(
        "Reproduciendo fuente:",
        url
    );

    // ==================================
    // ANDROID APK
    // ==================================

    if (window.AndroidTVArg) {
        player.style.display = "none";
        if (fuente.reproductor === "vlc") {
            AndroidTVArg.playChannelVLC(
                url
            );
        } else {
            AndroidTVArg.playChannel(
                url,
                headers.Referer || "",
                headers["User-Agent"] || ""
            );
        }
        backBtn.classList.add("show");
        mostrarBackBtn();
        return;
    }

    // ==================================
    // WEB HLS NORMAL
    // ==================================

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {
                video.play();
                video.style.visibility = "visible";
                video.style.opacity = "1";
            }
        );

        hls.on(
            Hls.Events.ERROR,
            () => {
                mostrarMensaje(
                    "Error cargando canal"
                );
            }
        );
    }

    backBtn.classList.add("show");
    mostrarBackBtn();
}

function restaurarNavegacion() {

    let regresoSelector = false;

    console.log(
        "VOLVIENDO A:",
        origenReproduccion,
        "ultimoSelector:",
        ultimoSelector
    );


    // ==========================
    // RESTAURAR SELECTOR FUENTES
    // ==========================

    if (ultimoSelector === "fuentes") {

        let regresar = varianteAnterior || canalAnterior;

        if (
            regresar &&
            regresar.fuentes &&
            regresar.fuentes.length > 1
        ) {

            regresoSelector = true;

            setTimeout(() => {
                mostrarSelectorFuentes(regresar);
            },300);
        }
    }


    // ==========================
    // RESTAURAR SELECTOR VARIANTES
    // ==========================

    else if (
        ultimoSelector === "variantes" &&
        canalPadreAnterior
    ) {

        regresoSelector = true;

        setTimeout(() => {
            mostrarSelectorVariantes(canalPadreAnterior);
        },300);

    }


    // ==========================
    // LIMPIAR MEMORIA SI NO HAY REGRESO
    // ==========================

    if(!regresoSelector){
        limpiarEstadoSelectores();
    }


    restaurarMenu();


    // ==========================
    // MUY IMPORTANTE
    // ==========================

    if(!regresoSelector){
        ultimoSelector = null;
        varianteAnterior = null;
        canalAnterior = null;
        canalPadreAnterior = null;
    }
}

        }
        return;
    }

    if (estado === "menu") {
        if (window.AndroidTVArg) {
            AndroidTVArg.closeApp();
        }
    }
};

/* ===== BACK INTELIGENTE TV ===== */

function mostrarBackBtn() {
    if (bloqueandoBack) return;
    if (!backBtn.classList.contains("show")) {
        return;
    }
    backBtn.style.opacity = "0.75";
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => {
        if (backBtn.classList.contains("show")) {
            backBtn.style.opacity = "0.25";
        }
    }, 5000);
}
    
/* cualquier actividad vuelve a iluminarlo */

document.addEventListener("keydown", () => {
    mostrarBackBtn();
});

document.addEventListener("mousemove", () => {
    mostrarBackBtn();
});

document.addEventListener("click", () => {
    mostrarBackBtn();
});

window.addEventListener("tvback", () => {

    if (variantesAbierto) {
        document.getElementById("selectorVariantes").style.display = "none";
        variantesAbierto = false;
        ultimoSelector = null;
        canalPadreAnterior = null;
        varianteAnterior = null;
        itemVariantesActual = null;
        return;
    }

    if (selectorAbierto) {
        document.getElementById("selectorFuente").style.display = "none";
        selectorAbierto = false;
        if (canalPadreAnterior) {
            mostrarSelectorVariantes(canalPadreAnterior);
        }
        return;
    }

    // SALIDA DE RADIO
    if (estado === "radio") {

        radio.pause();
        radio.src = "";

        document.getElementById("radioScreen").style.display = "none";
        document.getElementById("radioTitle").textContent = "";

        // volver al menú de radios
        document.getElementById("menuSecundario").style.display = "flex";
        menu.style.display = "none";

        estado = "otros";

        backBtn.classList.remove("show");
        backBtn.style.opacity = "0";

        return;
    }

// cerrar player/web
if (estado === "web" || estado === "player") {
    manejarSalidaCanal();
    return;
}

    // volver del menú secundario
    if (estado === "otros") {

        document.getElementById("menuSecundario").style.display = "none";
        menu.style.display = "flex";

        estado = "menu";
        ubicacion = "principal";
        menuActual = "menu";

        if (window.AndroidTVArg) {
            AndroidTVArg.setMenuPrincipal(true);
        }
        return;
    }

    // salir de la app
    if (estado === "menu") {
        if (window.AndroidTVArg) {
            AndroidTVArg.closeApp();
        }
    }

});
