<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Argentina</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    
<style>

* { box-sizing: border-box; }

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
}

/* ===== SPLASH ===== */
#inicioTVArg {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 9999;
}

#inicioTVArg button {
    padding: 18px 28px;
    font-size: 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

#enterBtn { background: #0066cc; color: white; }

#installBtn {
    background: #222;
    color: white;
    border: 1px solid #444;
    display: none;
}

/* ===== LAYOUT ===== */

#menu{
    display:none;
    width:100%;
    height:100vh;
    background:#000;
    flex-direction:column;
    align-items:center;
}

#menuSecundario{
    display:none;
    width:100%;
    height:100vh;
    background:#000;
    flex-direction:column;
    align-items:center;
}

/* ===== OTROS ===== */

#titulo{
    font-size:42px;
    font-weight:bold;
    padding:40px 0 30px 0;
}

#tituloMenu{
    font-size:42px;
    font-weight:bold;
    padding:40px 0 30px 0;
}

#listaCanales,
#listaMenu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    padding:10px;
}

#listaBotones{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

    margin-top:auto;
    margin-bottom:45px;
}

.canal{
    min-width: 120px;
    padding: 10px 12px;
    font-size: 14px;
    text-align: center;
    background: #111;
    border-radius: 8px;
    border: 1px solid #222;
    cursor: pointer;
    transition: .2s;
}

.canal-canal{
    min-width: 130px;
    padding: 10px 12px;
    font-size: 14px;
    background: #111;
    border: 1px solid #2a2a2a;
}

.canal-menu{
    min-width: 100px;
    padding: 8px 10px;
    font-size: 12px;
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    opacity: 0.9;
}

.canal:hover{
    transform:scale(1.05);
    background:#0066cc;
}

#player {
    display: none;
    flex: 1;
    position: relative;
    background: black;
    width: 100%;
    height: 100%;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
    max-height: 100%;
    max-width: 100%;
}

#mensaje {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,.8);
    padding: 20px;
    border-radius: 10px;
    display: none;
}

#backBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 99999;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: white;
    border: 2px solid rgba(255,255,255,0.35);
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.95);
    transition: all .25s ease;
    pointer-events: none;
}

#backBtn.show {
    opacity: 0.75;
    transform: scale(1);
    pointer-events: auto;
}

#backBtn:hover,
#backBtn:focus {
    opacity: 1;
    transform: scale(1.15);
    outline: none;
    border-color: white;
    box-shadow: 0 0 12px rgba(255,255,255,.5);
}

#backMenuBtn{
    position: fixed;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    padding: 18px 28px;
    font-size: 22px;
    border-radius: 10px;
    border: 1px solid #222;
    background: #111;
    color: white;

    cursor: pointer;
}

/* ===== YOUTUBE OVERLAY ===== */

#ytOverlay {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    z-index: 9999;
}

#ytFrame {
    width: 100%;
    height: 100%;
    border: 0;
}

#ytOverlay iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

#backMenuBtn{
    padding:18px 28px;
    font-size:22px;
    border-radius:10px;
    border:1px solid #222;
    background:#111;
    color:white;
    cursor:pointer;
}

#webOverlay {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    z-index: 10000;
}

#webFrame {
    width: 100%;
    height: 100%;
    border: 0;
}

#closeWebBtn {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10001;

    width: 44px;
    height: 44px;
    border-radius: 50%;

    background: rgba(0,0,0,0.25);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);

    cursor: pointer;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="inicioTVArg">
    <button id="enterBtn">▶ Ingresar a TVArg</button>
    <button id="installBtn">📲 Instalar TVArg</button>
</div>

<!-- MENU -->
<div id="menu">
    <div id="titulo">
        📺 TV ARG
    </div>
    <div id="listaCanales"></div>
    <div id="listaBotones"></div>
</div>

<!-- MENU SECUNDARIO -->
<div id="menuSecundario" style="display:none;">
    <div id="tituloMenu"></div>
    <div id="listaMenu"></div>
<button id="backMenuBtn">↩ Volver</button>
</div>

<!-- PLAYER -->
<div id="player">
    <div id="mensaje"></div>
    <video id="video" controls autoplay></video>
</div>

<!-- RADIO -->
<div id="radioScreen"
     style="
        display:none;
        position:fixed;
        inset:0;
        background:black;
        z-index:9000;
        justify-content:center;
        align-items:center;
        flex-direction:column;
     ">

    <div id="radioTitle"
         style="
            font-size:42px;
            font-weight:bold;
            text-align:center;
         ">
    </div>

</div>

<!-- YOUTUBE OVERLAY -->
<div id="ytOverlay">
    <iframe id="ytFrame"></iframe>
</div>

<!-- WEB OVERLAY (OTROS) -->
<div id="webOverlay">
    <iframe id="webFrame"></iframe>
</div>

<button id="backBtn">↩</button>

<script>

const canales = [
    { nombre:"América TV", tipo:"youtube", url:"https://www.youtube.com/embed/QeYYAKXyXHg?autoplay=1" },
    { nombre:"TV Pública", tipo:"youtube", url:"https://www.youtube.com/embed/jZHZhzQiTek?autoplay=1" },
    { nombre:"El Nueve", tipo:"youtube", url:"https://www.youtube.com/embed/C1DhpJ07ZuE?autoplay=1" },

    {
    nombre: "El Trece",
    tipo: "hls",
    url: "https://livetrx01.vodgc.net/eltrecetv/index.m3u8",
    headers: {
        Referer: "https://vodgc.net",
        "User-Agent": "Mozilla/5.0 (Linux; Android 8.0.0; Pixel 2 XL Build/OPD1.170816.004) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Mobile Safari/537.36"
    }
},
    
    { nombre:"TN", tipo:"hls", url:"https://live-01-01-tn.vodgc.net/TN_DAI_Beta/index.m3u8" },
    { nombre:"C5N", tipo:"youtube", url:"https://www.youtube.com/embed/VWhQ6xspnSc?autoplay=1" },
    { nombre:"Crónica", tipo:"youtube", url:"https://www.youtube.com/embed/JC7f3EUDaqw?autoplay=1" },
    { nombre:"LN+", tipo:"youtube", url:"https://www.youtube.com/embed/FEWZjXJ7M0c?autoplay=1" },
    { nombre:"A24", tipo:"youtube", url:"https://www.youtube.com/embed/ArKbAx1K-2U?autoplay=1" }, 
    { nombre: "9 Litoral", tipo: "hls", url:"https://stream.arcast.live/canal9litoral/ngrp:canal9litoral_all/playlist.m3u8" },
    { nombre:"Canal 26", tipo:"hls", url:"https://stream-gtlc.telecentro.net.ar/hls/canal26hls/main.m3u8" }
];


const menus = {
    principal: {
        titulo: "📺 TV ARG",
        items: canales,
        botones: [
            { nombre:"📻 RADIOS", destino:"radios" },
            { nombre:"👦 KIDS", destino:"kids" },
            { nombre:"📰 NOTICIAS", destino:"noticias" },
            { nombre:"⚽ DEPORTES", destino:"deportes" }
        ]
    },

    radios: {
        titulo:"📻 RADIOS",
        items: [
            { banda: "FM", nombre: "ASPEN", frecuencia: "102.3", tipo: "radio", destino: "radio", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/ASPEN_SC" },
            { banda: "FM", nombre: "BLUE", frecuencia: "100.7", tipo: "radio", destino: "radio", url: "https://24253.live.streamtheworld.com/BLUE_FM_100_7.mp3" },
            { banda: "FM", nombre: "TANGO", frecuencia: "92.7", tipo: "radio", destino: "radio", url: "https://media.radios.ar:9270/" }
        ]
    },

    kids: {
        titulo: "👦 KIDS",
        items: [
            { nombre: "LN+", tipo: "youtube", url: "https://www.youtube.com/embed/FEWZjXyXHg?autoplay=1" }
        ]
    },

    noticias: {
        titulo: "📰 NOTICIAS",
        items: [
            { nombre: "Ar|12", tipo: "youtube", url: "https://www.youtube.com/embed/JrmCaXL5GZs?autoplay=1" }
        ]
    },

    deportes: {
        titulo: "⚽ DEPORTES",
        items: [
            { nombre: "ESPN", tipo: "web", url: "https://www.espn.com.ar", modo: "external" },
            { nombre: "TyC Sports", tipo: "web", url: "https://www.tycsports.com", modo: "external" }
        ]
    }
};

let hls;
let estado = "splash";
let estadoAnterior = "";
let menuActual = "menu";
let menuOrigen = "menu";
let inactivityTimer;
let radio = new Audio();

const menu = document.getElementById("menu");
const video = document.getElementById("video");
const mensaje = document.getElementById("mensaje");
const splash = document.getElementById("inicioTVArg");
const enterBtn = document.getElementById("enterBtn");
const installBtn = document.getElementById("installBtn");
const backBtn = document.getElementById("backBtn");
const player = document.getElementById("player");

/* ===== SPLASH ===== */

enterBtn.onclick = () => {
    splash.style.display = "none";
    menu.style.display = "flex";
    estado = "menu";
};

if (window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true) {
    splash.style.display = "none";
    menu.style.display = "flex";
    estado = "menu";
}

/* ===== YOUTUBE PARSER ===== */

function getYouTubeEmbed(url) {

    try {
        const u = new URL(url);

        let id = u.searchParams.get("v");

        // soporte shorts
        if (!id && u.pathname.includes("/shorts/")) {
            id = u.pathname.split("/shorts/")[1];
        }

        if (!id) return null;

        return `https://www.youtube.com/embed/${id}`;

    } catch {
        return null;
    }
}

/* ===== PLAYER ===== */
function mostrarMensaje(texto) {

    mensaje.textContent = texto;
    mensaje.style.display = "block";

    setTimeout(() => {
        mensaje.style.display = "none";
    }, 3000);
}

function salirDelPlayer() {

    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.srcObject = null;
    video.load();

    document.getElementById("ytOverlay").style.display = "none";
    document.getElementById("ytFrame").src = "";

    backBtn.classList.remove("show");
    backBtn.style.opacity = "0";

    clearTimeout(inactivityTimer);
    }

function mostrarMenuSecundario() {
    if (window.AndroidTVArg) {
        AndroidTVArg.setMenuPrincipal(false);
    }
    menu.style.display = "none";
    const menuSecundario = document.getElementById("menuSecundario");
    const backMenuBtn = document.getElementById("backMenuBtn");
    menuSecundario.style.display = "flex";
    backBtn.classList.remove("show");
    backBtn.style.opacity = "0";
    backMenuBtn.style.display = "block";
    backMenuBtn.style.opacity = "1";
    backMenuBtn.style.pointerEvents = "auto";
    menuActual = "otros";
    estado = "otros";
}

function abrirWeb(url) {
    estadoAnterior = estado;
    const overlay = document.getElementById("webOverlay");
    const frame = document.getElementById("webFrame");
    frame.src = url;
    overlay.style.display = "block";
    backBtn.classList.add("show");
    mostrarBackBtn();
    estado = "web";
}

function abrirElemento(item) {

    if (item.tipo === "youtube") {
        reproducirYoutube(item.url);
        return;
    }
    if (item.tipo === "hls") {
        reproducirHls(item);
        return;
    }
    if (item.tipo === "web") {
        abrirWeb(item.url, item.modo);
        return;
    }
    if (item.tipo === "radio") {
        reproducirRadio(item.url, item.banda, item.nombre, item.frecuencia);
        return;
    }

    console.warn("Tipo desconocido:", item);
}

function reproducirRadio(url, banda, nombre, frecuencia) {
    cerrarTodoMedia(); // limpia video/youtube/web
    estado = "radio";

    // 🔴 ocultar todo lo demás SI o SI
    menu.style.display = "none";
    document.getElementById("menuSecundario").style.display = "none";
    player.style.display = "none";

    // 🔴 mostrar pantalla radio
    const radioScreen = document.getElementById("radioScreen");
    const title = document.getElementById("radioTitle");

title.innerHTML = `
    <div style="
        font-size:52px;
        font-weight:300;
        color:#cfe6ff;
        line-height:1;
    ">
        ${banda}
        <span style="
            font-size:64px;
            font-weight:900;
            margin-left:10px;
            letter-spacing:1px;
            color:#cfe6ff;
        ">
            ${nombre}
        </span>
    </div>

    <div style="
        font-size:30px;
        color:#d7ecff;
        margin-top:2px;
        line-height:1;
        opacity:0.75;
    ">
        ${frecuencia ? frecuencia : ""}
    </div>
`;

    radioScreen.style.display = "flex";

    // 🔴 arrancar audio
    radio.src = url;
    radio.play().catch(() => {});

    // 🔴 back visible
    backBtn.classList.add("show");
}

function reproducirYoutube(url) {
    estado = "player";
    menu.style.display = "none";
    player.style.display = "flex";
    const iframe = document.getElementById("ytFrame");
    const overlay = document.getElementById("ytOverlay");
    iframe.src = "about:blank"; // 🔥 limpia primero
    overlay.style.display = "block";
    setTimeout(() => {
        iframe.src = url;
    }, 80);
    backBtn.classList.add("show");
}

function reproducirHls(canal) {
    estado = "player";
    menu.style.display = "none";
    player.style.display = "flex";
    if (hls) {
        hls.destroy();
        hls = null;
    }
    video.pause();
    video.removeAttribute("src");
    video.load();
    // 🔥 Android override (si existe)
    if (canal.headers && window.AndroidTVArg?.playChannel) {
        player.style.display = "none";
        AndroidTVArg.playChannel(
            canal.url,
            canal.headers?.Referer || "",
            canal.headers?.["User-Agent"] || ""
        );
        backBtn.classList.add("show");
        mostrarBackBtn();
        return;
    }

    // Web HLS normal
    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(canal.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play();
            video.style.visibility = "visible";
            video.style.opacity = "1";
        });
        hls.on(Hls.Events.ERROR, () => {
            mostrarMensaje("Error cargando canal");
        });
    }

    backBtn.classList.add("show");
    mostrarBackBtn();
}



function cargarCanal(canal) {
    abrirElemento(canal);
}

function dibujarMenu(nombreMenu) {
    const datos = menus[nombreMenu];
    if (!datos) return;
    if (nombreMenu === "principal") {
        document.getElementById("titulo").textContent = datos.titulo;
        const lista = document.getElementById("listaCanales");
        const listaBotones = document.getElementById("listaBotones");
        lista.innerHTML = "";
        listaBotones.innerHTML = "";
        // Canales
        datos.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "canal canal-canal";
            div.textContent = item.nombre;

            div.onclick = () => {
                menuOrigen = "menu";
                abrirElemento(item);
            };

            lista.appendChild(div);
        });
        // Botones de submenús
        if (datos.botones) {
            datos.botones.forEach(boton => {
                const div = document.createElement("div");
                div.className = "canal canal-menu";
                div.textContent = boton.nombre;
                div.onclick = () => {
                    dibujarMenu(boton.destino);
                    mostrarMenuSecundario(boton.destino);
                };
                listaBotones.appendChild(div);
            });
        }
        } else {
            document.getElementById("tituloMenu").textContent = datos.titulo;
            const lista = document.getElementById("listaMenu");
            lista.innerHTML = "";

            datos.items.forEach(item => {

                const div = document.createElement("div");
                div.className = "canal";
                div.textContent = item.nombre;

                div.onclick = () => {
                    menuOrigen = "otros";
                    abrirElemento(item);
                };

                lista.appendChild(div);

            });
        }
}

dibujarMenu("principal");

/* =========================
   CIERRE CENTRALIZADO
========================= */

function cerrarTodoMedia() {
    if (hls) {
        hls.destroy();
        hls = null;
    }
    video.pause();
    video.removeAttribute("src");
    video.load();
    document.getElementById("ytOverlay").style.display = "none";
    document.getElementById("ytFrame").src = "about:blank";
    document.getElementById("webOverlay").style.display = "none";
    document.getElementById("webFrame").src = "about:blank";
}

function cerrarTodo() {

    // 🔴 0. NUEVO: si hay radio activa, NO la maneja esta función
    // (la radio se cierra solo desde backBtn cuando estado === "radio")

    // 🔴 1. destruir HLS SIEMPRE
    if (hls) {
        hls.destroy();
        hls = null;
    }

    // 🔴 2. limpiar video nativo SIEMPRE
    video.pause();
    video.removeAttribute("src");
    video.srcObject = null;
    video.load();

    // 🔴 3. FORZAR STOP YOUTUBE (esto es CLAVE)
    const ytFrame = document.getElementById("ytFrame");
    const ytOverlay = document.getElementById("ytOverlay");

    ytOverlay.style.display = "none";
    ytFrame.src = "about:blank";

    // 🔴 4. FORZAR STOP WEB
    const webFrame = document.getElementById("webFrame");
    const webOverlay = document.getElementById("webOverlay");

    webOverlay.style.display = "none";
    webFrame.src = "about:blank";

    // 🔴 5. limpiar UI player
    player.style.display = "none";

    // 🔴 6. back UI
    backBtn.classList.remove("show");
    backBtn.style.opacity = "0";

    clearTimeout(inactivityTimer);

    // 🔴 7. CRÍTICO: reset estado coherente
    estado = "menu";

    // 🔴 8. restaurar UI menú
    menu.style.display = "flex";
    document.getElementById("menuSecundario").style.display = "none";
}

/* =========================
   BACK BUTTON (UI)
========================= */

backBtn.onclick = () => {

    // 🔴 NUEVO: SALIDA DE RADIO
    if (estado === "radio") {

        radio.pause();
        radio.src = "";

        document.getElementById("radioScreen").style.display = "none";
        document.getElementById("radioTitle").innerHTML = "";

        // volver al submenú desde donde salió
        document.getElementById("menuSecundario").style.display = "flex";
        menu.style.display = "none";

        estado = "otros";

        backBtn.classList.remove("show");
        backBtn.style.opacity = "0";

        return;
    }

    // 🔴 EXISTENTE (NO TOCADO)
    if (estado === "web" || estado === "player") {
        cerrarTodo();
        return;
    }

    if (estado === "otros") {
        document.getElementById("menuSecundario").style.display = "none";
        menu.style.display = "flex";
        estado = "menu";
        menuActual = "menu";

        if (window.AndroidTVArg) {
            AndroidTVArg.setMenuPrincipal(true);
        }
        return;
    }

    if (estado === "menu") {
        if (window.AndroidTVArg) {
            AndroidTVArg.closeApp();
        }
    }
};

/* =====      ===== */

document.getElementById("backMenuBtn").onclick = () => {
    document.getElementById("menuSecundario").style.display = "none";
    menu.style.display = "flex";
    menuActual = "menu";
    if (window.AndroidTVArg) {
        AndroidTVArg.setMenuPrincipal(true);
    }
    estado = "menu";
};

/* ===== BACK INTELIGENTE TV ===== */

function mostrarBackBtn() {

    if (!backBtn.classList.contains("show")) {
        return;
    }

    backBtn.style.opacity = "0.75";

    clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(() => {

        if (backBtn.classList.contains("show")) {
            backBtn.style.opacity = "0.25";
        }

    }, 5000);
}

/* cualquier actividad vuelve a iluminarlo */

document.addEventListener("keydown", () => {
    mostrarBackBtn();
});

document.addEventListener("mousemove", () => {
    mostrarBackBtn();
});

document.addEventListener("click", () => {
    mostrarBackBtn();
});

/* ===== DEPURACIÓN TECLAS ===== */

document.addEventListener("keydown", e => {

    console.log(
        "KEY =", e.key,
        "KEYCODE =", e.keyCode,
        "WHICH =", e.which
    );

});


/* ===== BACK ENVIADO DESDE ANDROID ===== */

/* =========================
   BACK ANDROID (CRÍTICO)
========================= */

window.addEventListener("tvback", () => {

    // SALIDA DE RADIO
    if (estado === "radio") {

        radio.pause();
        radio.src = "";

        document.getElementById("radioScreen").style.display = "none";
        document.getElementById("radioTitle").textContent = "";

        // volver al menú de radios
        document.getElementById("menuSecundario").style.display = "flex";
        menu.style.display = "none";

        estado = "otros";

        backBtn.classList.remove("show");
        backBtn.style.opacity = "0";

        return;
    }

    // cerrar player/web
    if (estado === "player" || estado === "web") {
        cerrarTodo();
        return;
    }

    // volver del menú secundario
    if (estado === "otros") {

        document.getElementById("menuSecundario").style.display = "none";
        menu.style.display = "flex";

        estado = "menu";
        menuActual = "menu";

        if (window.AndroidTVArg) {
            AndroidTVArg.setMenuPrincipal(true);
        }
        return;
    }

    // salir de la app
    if (estado === "menu") {
        if (window.AndroidTVArg) {
            AndroidTVArg.closeApp();
        }
    }

});

</script>
</body>
</html>
