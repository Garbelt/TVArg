    padding: 12px;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.2;

    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#inicioTVArg button span {
    font-size: 16px;

}
#enterSmartBtn {
    background: #0066cc;

}
#enterManualBtn {
    background: #444;
    color: white;

#enterBtn { background: #0066cc; color: white; }

#installBtn {

    display:none;

    align-items:center;

#menuSecundario{

#listaCanales,

#listaBotones{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    padding:10px;
    margin-top:auto;
    margin-bottom:45px;
}

.canal{
    min-width: 120px;
    padding: 10px 12px;
    font-size: 14px;
    text-align: center;
    background: #111;
    border-radius: 8px;
    border: 1px solid #222;
    cursor: pointer;
    transition: .2s;

.canal-canal{
    min-width: 130px;
    padding: 10px 12px;
    font-size: 14px;
    background: #111;
    border: 1px solid #2a2a2a;

.canal-menu{

    font-weight:bold;
    background:#FFF29E;
    color:#222;

.canal-canal:hover{

    color:white;
}
.canal-menu:hover{
    background:#E9C85A;
    color:#111;
}

#player {
    display: none;
    flex: 1;

    background: black;
    width: 100%;
    height: 100%;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
    max-height: 100%;
    max-width: 100%;
}

#mensaje {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,.8);
    padding: 20px;
    border-radius: 10px;
    display: none;
}

#backBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 99999;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: white;
    border: 2px solid rgba(255,255,255,0.35);
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.95);
    transition: all .25s ease;
    pointer-events: none;
}

#backBtn.show {
    opacity: 0.75;
    transform: scale(1);
    pointer-events: auto;
}

#backBtn:hover,
#backBtn:focus {
    opacity: 1;
    transform: scale(1.15);
    outline: none;
    border-color: white;
    box-shadow: 0 0 12px rgba(255,255,255,.5);

#backMenuBtn{
    position: fixed;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 22px;
    border-radius: 10px;
    border: 1px solid #222;
    background: #111;
    color: white;

    background: black;
    display: none;

    height: 100%;
    border: 0;

    height: 100%;
    border: 0;

#webOverlay {

function getYouTubeEmbed(url) {

    try {
        const u = new URL(url);

        let id = u.searchParams.get("v");

        // soporte shorts
        if (!id && u.pathname.includes("/shorts/")) {
            id = u.pathname.split("/shorts/")[1];
        }

        if (!id) return null;

        return `https://www.youtube.com/embed/${id}`;

    } catch {
        return null;
    }
}

function reproducirHls(canal) {
    estado = "player";
    menu.style.display = "none";
    player.style.display = "flex";
    if (hls) {
        hls.destroy();
        hls = null;
    }
    video.pause();
    video.removeAttribute("src");
    video.load();

    // ==================================
    // NUEVO SISTEMA DE FUENTES
    // ==================================
    canalActual = canal;
    if (!canalActual.fuentes) {
        console.error("Canal sin fuentes");
        return;
    }
    fuenteActual = 0;
    intentosFuente = 0;
    let fuente = canalActual.fuentes[fuenteActual];

    let url = fuente.url;
    let headers = fuente.headers || {};
    console.log(
        "Reproduciendo fuente:",
        url
    );

    // ==================================
    // ANDROID APK
    // ==================================

    if (window.AndroidTVArg) {
        player.style.display = "none";
        if (fuente.reproductor === "vlc") {
            AndroidTVArg.playChannelVLC(
                url
            );
        } else {
            AndroidTVArg.playChannel(
                url,
                headers.Referer || "",
                headers["User-Agent"] || ""
            );
        }
        backBtn.classList.add("show");
        mostrarBackBtn();
        return;
    }

    // ==================================
    // WEB HLS NORMAL
    // ==================================

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {
                video.play();
                video.style.visibility = "visible";
                video.style.opacity = "1";
            }
        );

        hls.on(
            Hls.Events.ERROR,
            () => {
                mostrarMensaje(
                    "Error cargando canal"
                );
            }
        );
    }

    backBtn.classList.add("show");
    mostrarBackBtn();
}

    if (

        setTimeout(() => {
