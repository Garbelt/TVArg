<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVArg - Visor Evaluador</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;

}


h1{

    text-align:center;
    margin:25px 0;

}



#volver{

    position:fixed;

    top:8px;
    right:8px;

    width:32px;
    height:32px;

    border-radius:50%;

    border:1px solid #555;

    background:#222;

    color:white;

    font-size:16px;

    cursor:pointer;

    z-index:10;

}



#controles{

    text-align:center;
    margin-bottom:20px;

}


button{

    padding:8px 15px;

    margin:5px;

    background:#0066cc;

    color:white;

    border:none;

    border-radius:6px;

    cursor:pointer;

}



table{

    width:95%;

    margin:auto;

    border-collapse:collapse;

    background:#222;

    font-size:14px;

}



th{

    background:#333;

}



th,td{

    border:1px solid #444;

    padding:8px;

    text-align:center;

}



.ok{

    color:#6cff6c;

    font-weight:bold;

}



.error{

    color:#ff7070;

    font-weight:bold;

}



#resumen{

    width:95%;

    margin:20px auto;

    padding:12px;

    background:#222;

    border-radius:8px;

}



</style>

</head>


<body>


<button id="volver" onclick="volver()">
↩
</button>


<h1>
📺 Evaluador TVArg
</h1>



<div id="controles">

<button onclick="cargar()">
Actualizar
</button>


<button onclick="borrar()">
Borrar historial
</button>

</div>



<div id="resumen"></div>



<table>


<thead>

<tr>

<th>#</th>
<th>Canal</th>
<th>Tipo</th>
<th>Resultado</th>
<th>Arranque</th>
<th>Inicio</th>
<th>Fin Arranque</th>
<th>Fecha</th>

</tr>

</thead>


<tbody id="tabla">

</tbody>


</table>



<script>


const KEY="TVArg_Evaluaciones";



function cargar(){


let datos=[];


try{

datos=
JSON.parse(
localStorage.getItem(KEY) || "[]"
);


}catch(e){

datos=[];

}



const tabla=
document.getElementById("tabla");


tabla.innerHTML="";



datos.reverse().forEach((e,i)=>{


tabla.innerHTML += `

<tr>

<td>${i+1}</td>


<td>${e.canal || "-"}</td>


<td>${e.tipo || "-"}</td>



<td class="${
e.resultado==="INICIA"
?"ok"
:"error"
}">

${e.resultado || "-"}

</td>



<td>

${
e.tiempoArranqueSegundos!==null
?
e.tiempoArranqueSegundos+" seg"
:
"-"
}

</td>



<td>
${e.minutoInicio || "-"}
</td>



<td>
${e.minutoFin || "-"}
</td>



<td>
${
e.inicio
?
new Date(e.inicio).toLocaleString()
:
"-"
}
</td>



</tr>

`;


});



document.getElementById("resumen").innerHTML=

`

<b>Total:</b> ${datos.length}

&nbsp;&nbsp;

<b>Iniciaron:</b>
${datos.filter(x=>x.resultado==="INICIA").length}

&nbsp;&nbsp;

<b>No iniciaron:</b>
${datos.filter(x=>x.resultado==="NO INICIA").length}

`;

}



function borrar(){


if(!confirm("¿Borrar mediciones?"))
return;


localStorage.removeItem(KEY);


cargar();


}



function volver(){

window.location.href="index.html";

}



cargar();


</script>


</body>
</html>
