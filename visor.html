<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visor Evaluaciones TVArg</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

#resumen{
    text-align:center;
    margin-bottom:20px;
    font-size:18px;
    color:#9fd2ff;
}

.tabla{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

.tabla th{
    background:#1a1a1a;
    color:#7bc2e3;
    border:1px solid #444;
    padding:10px;
    position:sticky;
    top:0;
}

.tabla td{
    border:1px solid #333;
    padding:8px;
    vertical-align:top;
}

.tabla tr:nth-child(even){
    background:#111;
}

.tabla tr:hover{
    background:#1d1d1d;
}

.url{
    max-width:420px;
    word-break:break-all;
    font-size:11px;
    color:#bbb;
}

.ok{
    color:#66ff99;
    font-weight:bold;
}

.no{
    color:#ff6666;
    font-weight:bold;
}

/* botón flotante */

#volverBtn{

    position:fixed;

    right:15px;
    bottom:15px;

    width:42px;
    height:42px;

    border-radius:50%;
    border:none;

    background:#0066cc;
    color:white;

    font-size:20px;

    cursor:pointer;

    opacity:.75;

    transition:.2s;

    z-index:9999;

}

#volverBtn:hover{

    opacity:1;
    transform:scale(1.08);

}

</style>

</head>

<body>

<h1>📺 Evaluaciones TVArg</h1>

<div id="resumen"></div>

<div id="lista"></div>

<button id="volverBtn" title="Volver">
↩
</button>

<script>

function cargarEvaluaciones(){

    const datos =
        JSON.parse(
            localStorage.getItem("evaluacionesTVArg")
        ) || {};

    const lista =
        document.getElementById("lista");

    const resumen =
        document.getElementById("resumen");

    const claves =
        Object.keys(datos);

    resumen.innerHTML =
        "<b>Fuentes evaluadas:</b> "
        + claves.length;

    if(claves.length===0){

        lista.innerHTML=
        "<h2 style='text-align:center'>No existen evaluaciones.</h2>";

        return;
    }

    let html=`

<table class="tabla">

<tr>

<th>Canal</th>

<th>Tipo</th>

<th>Reprod.</th>

<th>Eval.</th>

<th>Prom.</th>

<th>Última</th>

<th>Estado</th>

<th>URL</th>

</tr>

`;

    claves.forEach(id=>{

        const item=datos[id];

        const bloqueado =
            item.bloqueoHasta &&
            Date.now()<item.bloqueoHasta;

        html+=`

<tr>

<td>${item.canal||""}</td>

<td>${item.tipo||""}</td>

<td>${item.reproductor||""}</td>

<td style="text-align:center">
${item.evaluaciones||0}
</td>

<td style="text-align:center">
${item.promedio||0}
</td>

<td>
${item.ultimaEvaluacion||""}
</td>

<td class="${
bloqueado ? "no":"ok"
}">
${
bloqueado
?
"🔒 BLOQUEADO"
:
"✅ LIBRE"
}
</td>

<td class="url">
${item.fuente||""}
</td>

</tr>

`;

    });

    html+="</table>";

    lista.innerHTML=html;

}

document.getElementById("volverBtn").onclick=()=>{

    location.href="index.html";

};

cargarEvaluaciones();

</script>

</body>
</html>
