<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TVArg - TV A LA CARTA</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #050505;

    color: white;

    font-family: Arial, sans-serif;
}


/* =========================================================
   CABECERA
========================================================= */

header {

    padding: 20px;

    text-align: center;

    background:
        linear-gradient(
            to bottom,
            #181818,
            #090909
        );

    border-bottom: 1px solid #333;
}

header h1 {

    margin: 0;

    font-size: 28px;
}

header p {

    margin: 6px 0 0;

    color: #aaa;
}


/* =========================================================
   VOLVER A TVARG
========================================================= */

#volverTVArg {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 2000;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.65);

    color: white;

    font-size: 22px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: .2s;
}

#volverTVArg:hover {

    background:
        rgba(50,50,50,.9);

    transform: scale(1.08);
}


/* =========================================================
   ANDROID
========================================================= */

body.android-app #volverTVArg {

    display: none !important;
}


/* =========================================================
   BUSCADOR
========================================================= */

.buscador {

    padding:
        10px 15px 5px;

    display: flex;

    justify-content: center;

    min-height: 50px;
}


/* =========================================================
   CONTROL VISUAL INICIAL
========================================================= */

#activarBusqueda {

    width:
        min(600px, 95%);

    padding:
        9px 14px;

    border-radius: 20px;

    border:
        1px solid #333;

    background: #151515;

    color: #aaa;

    font-size: 14px;

    text-align: left;

    outline: none;

    cursor: pointer;
}

#activarBusqueda:focus {

    border-color: #777;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.08);
}


/* =========================================================
   INPUT REAL
========================================================= */

#buscar {

    display: none;

    width:
        min(600px, 95%);

    padding:
        9px 14px;

    border-radius: 20px;

    border:
        1px solid #333;

    background: #151515;

    color: white;

    font-size: 14px;

    outline: none;
}

#buscar:focus {

    border-color: #777;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.08);
}


/* =========================================================
   FILTROS
========================================================= */

.filtros {

    width: 100%;

    max-width: 1400px;

    margin: 0 auto;

    padding:
        3px 20px 10px;

    display: grid;

    grid-template-columns:
        minmax(180px, 1.7fr)
        minmax(115px, 1fr)
        minmax(115px, 1fr)
        minmax(150px, 1.2fr);

    gap: 7px;

    position: relative;

    z-index: 100;
}


/* =========================================================
   FILTRO PERSONALIZADO
========================================================= */

.filtroPersonalizado {

    position: relative;

    width: 100%;

    min-width: 0;
}


/* =========================================================
   BOTÓN DEL FILTRO
========================================================= */

.botonFiltro {

    width: 100%;

    height: 36px;

    padding:
        5px 30px 5px 10px;

    border:
        1px solid #333;

    border-radius: 6px;

    background: #151515;

    color: #ccc;

    font-size: 13px;

    outline: none;

    cursor: pointer;

    text-align: left;

    position: relative;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.botonFiltro::after {

    content: "▼";

    position: absolute;

    right: 10px;

    top: 50%;

    transform:
        translateY(-50%);

    font-size: 9px;

    color: #888;

    pointer-events: none;
}

.botonFiltro:hover {

    background: #202020;

    border-color: #555;
}

.botonFiltro:focus {

    border-color: #777;

    background: #202020;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.12);
}


/* =========================================================
   FILTRO ACTIVO
========================================================= */

.botonFiltro.activo {

    color: white;

    border-color: #555;
}


/* =========================================================
   LISTA DESPLEGABLE
========================================================= */

.listaFiltro {

    display: none;

    position: absolute;

    left: 0;

    top: calc(100% + 4px);

    width: 100%;

    max-height: 300px;

    overflow-y: auto;

    background: #151515;

    border:
        1px solid #444;

    border-radius: 7px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.75);

    z-index: 1000;

    padding: 4px;
}


/* =========================================================
   LISTA ABIERTA
========================================================= */

.filtroPersonalizado.abierto
.listaFiltro {

    display: block;
}


/* =========================================================
   OPCIONES
========================================================= */

.opcionFiltro {

    width: 100%;

    padding:
        8px 10px;

    border: none;

    border-radius: 5px;

    background: transparent;

    color: #ccc;

    font-size: 13px;

    text-align: left;

    cursor: pointer;

    white-space: nowrap;
}

.opcionFiltro:hover {

    background: #292929;

    color: white;
}


/* =========================================================
   OPCIÓN SELECCIONADA
========================================================= */

.opcionFiltro.seleccionada {

    background: #252525;

    color: white;

    font-weight: bold;
}

.opcionFiltro.seleccionada::before {

    content: "✓ ";

    color: #aaa;
}


/* =========================================================
   FOCO TV
========================================================= */

.opcionFiltro:focus {

    outline: none;

    background: #333;

    color: white;
}


/* =========================================================
   SCROLL DE LISTAS
========================================================= */

.listaFiltro::-webkit-scrollbar {

    width: 6px;
}

.listaFiltro::-webkit-scrollbar-track {

    background: #101010;
}

.listaFiltro::-webkit-scrollbar-thumb {

    background: #444;

    border-radius: 5px;
}

.listaFiltro::-webkit-scrollbar-thumb:hover {

    background: #666;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor {

    width: 100%;

    max-width: 1400px;

    margin: auto;

    padding:
        10px 20px 40px;
}


/* =========================================================
   TÍTULO DE RESULTADOS
========================================================= */

.tituloCategoria {

    font-size: 18px;

    color: #ccc;

    margin:
        8px 0 14px;
}


/* =========================================================
   PELÍCULAS
========================================================= */

.peliculas {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px, 1fr)
        );

    gap: 22px;
}


/* =========================================================
   TARJETA
========================================================= */

.pelicula {

    background: #111;

    border-radius: 8px;

    overflow: hidden;

    transition:
        transform .2s,
        box-shadow .2s;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    height: 100%;
}

.pelicula:hover {

    transform: scale(1.04);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.7);
}

.poster {

    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    display: block;

    background: #222;
}

.info {

    padding: 10px;

    display: flex;

    flex-direction: column;

    flex: 1;
}

.nombre {

    font-size: 15px;

    font-weight: bold;

    line-height: 1.25;
}

.año {

    color: #aaa;

    font-size: 13px;

    margin-top: auto;

    margin-bottom: 10px;
}

.ver {

    width: 100%;

    margin-top: 0;

    padding: 9px;

    border: none;

    border-radius: 5px;

    background: #e50914;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.ver:hover {

    background: #ff202b;
}


/* =========================================================
   REPRODUCTOR WEB
========================================================= */

#reproductor {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        rgba(0,0,0,.97);

    align-items: center;

    justify-content: center;

    flex-direction: column;
}

#video {

    width: 90%;

    max-width: 1100px;

    max-height: 80vh;

    background: black;
}

#tituloReproductor {

    margin: 10px;

    font-size: 20px;

    text-align: center;
}


/* =========================================================
   MENSAJE
========================================================= */

#mensajeReproductor {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 7000;

    width:
        min(90%, 500px);

    padding: 20px;

    border-radius: 10px;

    background:
        rgba(20,20,20,.95);

    border:
        1px solid #444;

    text-align: center;

    color: #ddd;
}


/* =========================================================
   MODAL SERIES
========================================================= */

#modalSeries {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    background:
        rgba(0,0,0,.94);

    align-items: center;

    justify-content: center;
}

#modalSeriesCaja {

    width:
        min(90%, 700px);

    max-height: 85vh;

    overflow-y: auto;

    background: #111;

    border:
        1px solid #333;

    border-radius: 14px;

    padding: 25px;
}

#modalSeriesTitulo {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 20px;
}


/* =========================================================
   TEMPORADAS
========================================================= */

.botonTemporada {

    width: 100%;

    margin:
        6px 0;

    padding: 13px;

    background: #222;

    color: white;

    border:
        1px solid #444;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

    text-align: left;
}

.botonTemporada:hover {

    background: #333;
}


/* =========================================================
   CAPÍTULOS
========================================================= */

.capitulos {

    display: none;

    margin:
        0 0 12px;
}

.botonCapitulo {

    width: 100%;

    margin:
        4px 0;

    padding: 10px;

    background: #191919;

    color: #ddd;

    border:
        1px solid #333;

    border-radius: 6px;

    text-align: left;

    cursor: pointer;
}

.botonCapitulo:hover {

    background: #292929;
}


/* =========================================================
   CANCELAR MODAL SERIES
========================================================= */

#cancelarSeries {

    width: 100%;

    margin-top: 18px;

    padding: 12px;

    border:
        1px solid #444;

    border-radius: 8px;

    background: #222;

    color: #ddd;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

#cancelarSeries:hover {

    background: #333;

    color: white;
}


/* =========================================================
   MÓVIL
========================================================= */

@media (max-width: 600px),
       (max-width: 800px) and (orientation: portrait) {

    header {

        padding:
            15px 10px;

        margin:
            8px 8px 0;

        border-radius:
            8px;
    }

    header h1 {

        font-size: 23px;
    }

    header p {

        font-size: 14px;
    }


    /* -----------------------------------------
       BUSCADOR
    ----------------------------------------- */

    .buscador {

        padding:
            8px 8px 4px;
    }

    #activarBusqueda,
    #buscar {

        width: 95%;

        padding:
            8px 12px;

        font-size: 13px;
    }


    /* -----------------------------------------
       FILTROS 2 × 2
    ----------------------------------------- */

    .filtros {

        width: 100%;

        margin: 0;

        padding:
            3px 14px 9px;

        grid-template-columns:
            1fr 1fr;

        gap: 6px;
    }

    .filtroPersonalizado {

        min-width: 0;
    }

    .botonFiltro {

        height: 35px;

        padding:
            5px 25px 5px 9px;

        font-size: 12px;

        border-radius: 6px;
    }

    .listaFiltro {

        max-height: 250px;
    }

    .opcionFiltro {

        padding:
            8px 9px;

        font-size: 12px;
    }


    /* -----------------------------------------
       CONTENIDO
    ----------------------------------------- */

    .contenedor {

        padding:
            5px 14px 30px;
    }

    .tituloCategoria {

        font-size: 16px;

        margin:
            6px 0 12px;
    }


    /* -----------------------------------------
       TARJETAS
    ----------------------------------------- */

    .peliculas {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .nombre {

        font-size: 14px;
    }

    .año {

        font-size: 12px;
    }

    .ver {

        padding: 8px;

        font-size: 13px;
    }

}


/* =========================================================
   TV / WEBVIEW PEQUEÑO — HORIZONTAL
========================================================= */

@media (min-width: 601px) and (max-width: 1100px)
       and (orientation: landscape) {

    header {

        margin:
            12px 18px 0;

        padding:
            12px;

        border-radius:
            10px;
    }

    header h1 {

        font-size: 22px;
    }

    header p {

        font-size: 13px;
    }


    /* -----------------------------------------
       BUSCADOR
    ----------------------------------------- */

    .buscador {

        margin:
            8px 18px 0;

        padding:
            6px 8px 3px;
    }

    #activarBusqueda,
    #buscar {

        padding:
            7px 12px;

        font-size: 12px;
    }


    /* -----------------------------------------
       FILTROS
    ----------------------------------------- */
      

.filtros {

    width: calc(100% - 32px);

    margin:
        0 16px;

    padding:
        2px 0 8px;

    display: grid;

    grid-template-columns:
        1.7fr 1fr 1fr 1.2fr;

    gap: 5px;
}

    .botonFiltro {

        height: 32px;

        padding:
            4px 24px 4px 8px;

        font-size: 11px;

        border-radius: 5px;
    }

    .botonFiltro::after {

        right: 8px;

        font-size: 8px;
    }

    .listaFiltro {

        max-height: 230px;

        padding: 3px;

        border-radius: 6px;
    }

    .opcionFiltro {

        padding:
            6px 8px;

        font-size: 11px;
    }


    /* -----------------------------------------
       CONTENIDO
    ----------------------------------------- */

    .contenedor {

        padding:
            8px 28px 35px;
    }

    .tituloCategoria {

        font-size: 15px;

        margin:
            6px 0 10px;
    }


    /* -----------------------------------------
       TARJETAS
    ----------------------------------------- */

    .peliculas {

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(130px, 1fr)
            );

        gap: 12px;
    }

    .info {

        padding: 7px;
    }

    .nombre {

        font-size: 12px;
    }

    .año {

        font-size: 11px;
    }

    .ver {

        padding: 6px;

        margin-top: 6px;

        font-size: 11px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     VOLVER A TVARG
===================================================== -->

<button
    id="volverTVArg"
    onclick="volverTVArg()"
    title="Volver a TVArg">

    ←

</button>


<!-- =====================================================
     CABECERA
===================================================== -->

<header>

    <h1>
        🎬 TV A LA CARTA
    </h1>

    <p>
        Películas y series
    </p>

</header>


<!-- =====================================================
     BUSCADOR
===================================================== -->

<div class="buscador">

    <button
        id="activarBusqueda"
        type="button">

        🔎 Buscar película o serie...

    </button>


    <input
        type="text"
        id="buscar"
        placeholder="🔎 Buscar película o serie..."
        autocomplete="off"
        oninput="filtrar()">

</div>


<!-- =====================================================
     FILTROS PERSONALIZADOS
===================================================== -->

<div
    class="filtros"
    id="filtros">


    <!-- =================================================
         CATEGORÍA
    ================================================== -->

    <div
        class="filtroPersonalizado"
        id="contenedorCategoria">

        <button
            class="botonFiltro"
            id="botonCategoria"
            type="button">

        </button>

        <div
            class="listaFiltro"
            id="listaCategoria">

        </div>

    </div>


    <!-- =================================================
         DESDE
    ================================================== -->

    <div
        class="filtroPersonalizado"
        id="contenedorDesde">

        <button
            class="botonFiltro"
            id="botonDesde"
            type="button">

            2022

        </button>

        <div
            class="listaFiltro"
            id="listaDesde">

        </div>

    </div>


    <!-- =================================================
         HASTA
    ================================================== -->

    <div
        class="filtroPersonalizado"
        id="contenedorHasta">

        <button
            class="botonFiltro"
            id="botonHasta"
            type="button">

            2026

        </button>

        <div
            class="listaFiltro"
            id="listaHasta">

        </div>

    </div>


    <!-- =================================================
         TIPO
    ================================================== -->

    <div
        class="filtroPersonalizado"
        id="contenedorTipo">

        <button
            class="botonFiltro"
            id="botonTipo"
            type="button">

            TODAS

        </button>

        <div
            class="listaFiltro"
            id="listaTipo">

        </div>

    </div>

</div>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<div class="contenedor">

    <div
        class="tituloCategoria"
        id="tituloCategoria">

        TODAS

    </div>

    <div
        class="peliculas"
        id="peliculas">
    </div>

</div>

        id="tituloReproductor">
    </div>

        id="video"
        controls
        autoplay
        playsinline>
    </video>

</div>


<!-- =====================================================
     MENSAJE
===================================================== -->

<div id="mensajeReproductor">

    <div id="textoMensaje"></div>

</div>


<!-- =====================================================
     MODAL SERIES
===================================================== -->

<div id="modalSeries">

    <div id="modalSeriesCaja">

        <div id="modalSeriesTitulo">
            SERIE
        </div>

        <div id="contenidoSeries"></div>

        <button
            id="cancelarSeries"
            onclick="cerrarSeries()">

            CANCELAR

        </button>

    </div>

</div>


<!-- =====================================================
     DATOS
===================================================== -->

<script src="libreria/TVALCp01.js"></script>
<script src="libreria/TVALCp02.js"></script>
<script src="libreria/TVALCp03.js"></script>
<script src="libreria/TVALCp04.js"></script>
<script src="libreria/TVALCp05.js"></script>
<script src="libreria/TVALCp06.js"></script>
<script src="libreria/TVALCp07.js"></script>

<script src="libreria/TVALCs01.js"></script>
<script src="libreria/TVALCs02.js"></script>
<script src="libreria/TVALCs03.js"></script>


<script>

/* =========================================================
   DATOS TV A LA CARTA
========================================================= */

const peliculas =
    window.TVALC_PELICULAS || [];

const series =
    window.TVALC_SERIES || [];


/* =========================================================
   DETECTAR ANDROID TVARG
========================================================= */

const esAndroidTVArg =
    !!window.AndroidTVArg;

if (esAndroidTVArg) {

    document.body.classList.add(
        "android-app"
    );

}


/* =========================================================
   ESTADO
========================================================= */

let reproductorAbierto =
    false;

let reproduccionNativa =
    false;

let busquedaActiva =
    false;


/* =========================================================
   AÑO ACTUAL
========================================================= */

const añoActual =
    new Date().getFullYear();


/* =========================================================
   ELEMENTOS BUSCADOR
========================================================= */

const botonActivarBusqueda =
    document.getElementById(
        "activarBusqueda"
    );

const inputBuscar =
    document.getElementById(
        "buscar"
    );


/* =========================================================
   CATEGORÍAS
========================================================= */

const categorias = [

    "TODAS",

    "Acción",

    "Aventura",

    "Comedia",

    "Infantil",

    "Drama",

    "Ciencia ficción",

    "Fantasía",

    "Terror",

    "Suspenso",

    "Romance",

    "Crimen",

    "Documental",

    "Historia",

    "Musical",

    "Bélica",

    "Western"

];


/* =========================================================
   ESTADO DE FILTROS
========================================================= */

let filtroActual = {

    categoria: "TODAS",

    desde: añoActual - 4,

    hasta: añoActual,

    tipo: "TODAS"

};


/* =========================================================
   ELEMENTOS FILTROS
========================================================= */

const filtrosPersonalizados = {

    categoria: {

        contenedor:
            document.getElementById(
                "contenedorCategoria"
            ),

        boton:
            document.getElementById(
                "botonCategoria"
            ),

        lista:
            document.getElementById(
                "listaCategoria"
            )

    },

    desde: {

        contenedor:
            document.getElementById(
                "contenedorDesde"
            ),

        boton:
            document.getElementById(
                "botonDesde"
            ),

        lista:
            document.getElementById(
                "listaDesde"
            )

    },

    hasta: {

        contenedor:
            document.getElementById(
                "contenedorHasta"
            ),

        boton:
            document.getElementById(
                "botonHasta"
            ),

        lista:
            document.getElementById(
                "listaHasta"
            )

    },

    tipo: {

        contenedor:
            document.getElementById(
                "contenedorTipo"
            ),

        boton:
            document.getElementById(
                "botonTipo"
            ),

        lista:
            document.getElementById(
                "listaTipo"
            )

    }

};


/* =========================================================
   CARGAR AÑOS
========================================================= */

function obtenerRangoAños() {

    const añosDatos = [

        ...peliculas,
        ...series

    ]
        .map(
            elemento =>
                parseInt(
                    elemento.año,
                    10
                )
        )
        .filter(
            año =>
                !isNaN(año)
        );


    const añoInicial =
        añoActual - 4;


    const añoMasAntiguo =
        añosDatos.length
            ? Math.min(...añosDatos)
            : añoInicial;


    return {

        minimo:
            Math.min(
                añoMasAntiguo,
                añoInicial
            ),

        maximo:
            añoActual

    };

}


/* =========================================================
   CREAR OPCIÓN
========================================================= */

function crearOpcion(
    lista,
    texto,
    valor,
    grupo
) {

    const opcion =
        document.createElement(
            "button"
        );


    opcion.type =
        "button";


    opcion.className =
        "opcionFiltro";


    opcion.textContent =
        texto;


    opcion.dataset.valor =
        valor;


    opcion.tabIndex =
        -1;


    if (
        String(
            filtroActual[grupo]
        ) ===
        String(valor)
    ) {

        opcion.classList.add(
            "seleccionada"
        );

    }


    opcion.onclick =
        event => {

            event.stopPropagation();

            seleccionarFiltro(
                grupo,
                valor
            );

        };


    lista.appendChild(
        opcion
    );


    return opcion;

}


/* =========================================================
   CARGAR FILTRO CATEGORÍA
========================================================= */

function cargarFiltroCategoria() {

    const filtro =
        filtrosPersonalizados.categoria;


    filtro.lista.innerHTML =
        "";


    categorias.forEach(
        categoria => {

            crearOpcion(
                filtro.lista,
                categoria,
                categoria,
                "categoria"
            );

        }
    );

}


/* =========================================================
   CARGAR FILTROS DE AÑOS
========================================================= */

function cargarFiltrosAños() {

    const rango =
        obtenerRangoAños();


    const desde =
        filtrosPersonalizados.desde;

    const hasta =
        filtrosPersonalizados.hasta;


    desde.lista.innerHTML =
        "";

    hasta.lista.innerHTML =
        "";


    /*
       DESDE

       Ascendente.
    */

    for (
        let año = rango.minimo;
        año <= rango.maximo;
        año++
    ) {

        crearOpcion(
            desde.lista,
            String(año),
            año,
            "desde"
        );

    }


    /*
       HASTA

       Descendente.
    */

    for (
        let año = rango.maximo;
        año >= rango.minimo;
        año--
    ) {

        crearOpcion(
            hasta.lista,
            String(año),
            año,
            "hasta"
        );

    }

}


/* =========================================================
   CARGAR FILTRO TIPO
========================================================= */

function cargarFiltroTipo() {

    const filtro =
        filtrosPersonalizados.tipo;


    filtro.lista.innerHTML =
        "";


    crearOpcion(
        filtro.lista,

        "tipo"
    );


    crearOpcion(
        filtro.lista,
        "PELÍCULAS",
        "peliculas",
        "tipo"
    );


    crearOpcion(
        filtro.lista,

        "series",
        "tipo"
    );

}


/* =========================================================

function actualizarBotonesFiltros() {

/* =========================================================
   ABRIR FILTRO
========================================================= */

function abrirFiltro(
    grupo
) {

    cerrarTodosLosFiltros(
        grupo
    );


    const filtro =
        filtrosPersonalizados[
            grupo
        ];


    filtro.contenedor
        .classList.add(
            "abierto"
        );


    const opciones =
        filtro.lista.querySelectorAll(
            ".opcionFiltro"
        );


    opciones.forEach(
        opcion => {

            opcion.tabIndex =
                -1;

        }
    );


    const seleccionada =
        filtro.lista.querySelector(
            ".opcionFiltro.seleccionada"
        );


    if (seleccionada) {

        seleccionada.scrollIntoView({
            block: "nearest"
        });

    }

}


/* =========================================================
   CERRAR FILTROS
========================================================= */

function cerrarTodosLosFiltros(
    excepto = null
) {

    Object.keys(
        filtrosPersonalizados
    ).forEach(
        grupo => {

            if (
                grupo === excepto
            ) {

                return;

            }


            filtrosPersonalizados[
                grupo
            ]
            .contenedor
            .classList.remove(
                "abierto"
            );

        }
    );

}


/* =========================================================
   SELECCIONAR FILTRO
========================================================= */

function seleccionarFiltro(
    grupo,
    valor
) {

    valor =
        grupo === "desde" ||
        grupo === "hasta"

            ? parseInt(
                valor,
                10
            )

            :

        valor;


    /*
       Si Desde supera Hasta,
       corregimos automáticamente.
    */

    if (
        grupo === "desde" &&
        valor >
        filtroActual.hasta
    ) {

        filtroActual.hasta =
            valor;

    }


    if (
        grupo === "hasta" &&
        valor <
        filtroActual.desde
    ) {

        filtroActual.desde =
            valor;

    }


    filtroActual[grupo] =
        valor;


    actualizarListasSeleccionadas();

    actualizarBotonesFiltros();

    cerrarTodosLosFiltros();

    mostrarContenido();

}


/* =========================================================
   ACTUALIZAR OPCIONES SELECCIONADAS
========================================================= */

function actualizarListasSeleccionadas() {

    Object.keys(
        filtrosPersonalizados
    ).forEach(
        grupo => {

            const filtro =
                filtrosPersonalizados[
                    grupo
                ];


            filtro.lista
                .querySelectorAll(
                    ".opcionFiltro"
                )
                .forEach(
                    opcion => {

                        opcion.classList.toggle(
                            "seleccionada",

                            String(
                                opcion.dataset.valor
                            ) ===
                            String(
                                filtroActual[
                                    grupo
                                ]
                            )
                        );

                    }
                );

        }
    );

}


/* =========================================================
   EVENTOS BOTONES FILTROS
========================================================= */

Object.keys(
    filtrosPersonalizados
).forEach(
    grupo => {

        const filtro =
            filtrosPersonalizados[
                grupo
            ];


        filtro.boton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                if (
                    filtro.contenedor
                        .classList
                        .contains(
                            "abierto"
                        )
                ) {

                    cerrarTodosLosFiltros();

                } else {

                    abrirFiltro(
                        grupo
                    );

                }

            }
        );


        /*
           Teclado / control remoto
        */

        filtro.boton.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" ||
                    event.key === "OK" ||
                    event.keyCode === 13 ||
                    event.keyCode === 23 ||
                    event.keyCode === 66
                ) {

                    event.preventDefault();

                    event.stopPropagation();

                    if (
                        filtro.contenedor
                            .classList
                            .contains(
                                "abierto"
                            )
                    ) {

                        cerrarTodosLosFiltros();

                    } else {

                        abrirFiltro(
                            grupo
                        );

                    }

                    return;

                }


                if (
                    event.key === "Escape" ||
                    event.key === "Back"
                ) {

                    if (
                        filtro.contenedor
                            .classList
                            .contains(
                                "abierto"
                            )
                    ) {

                        event.preventDefault();

                        cerrarTodosLosFiltros();

                    }

                }

            }
        );

    }
);


/* =========================================================
   CLIC FUERA DE LOS FILTROS
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".filtroPersonalizado"
            )
        ) {

            cerrarTodosLosFiltros();

        }

    }
);


/* =========================================================
   TECLADO DENTRO DE LISTAS
========================================================= */

Object.keys(
    filtrosPersonalizados
).forEach(
    grupo => {

        const lista =
            filtrosPersonalizados[
                grupo
            ].lista;


        lista.addEventListener(
            "keydown",
            function(event) {

                const opciones =
                    Array.from(
                        lista.querySelectorAll(
                            ".opcionFiltro"
                        )
                    );


                if (
                    !opciones.length
                ) {

                    return;

                }


                const actual =
                    document.activeElement;


                let indice =
                    opciones.indexOf(
                        actual
                    );


                /*
                   ABAJO
                */

                if (
                    event.key === "ArrowDown"
                ) {

                    event.preventDefault();

                    indice =
                        indice < 0
                            ? 0
                            : Math.min(
                                indice + 1,
                                opciones.length - 1
                            );

                    opciones[indice]
                        .focus();

                    opciones[indice]
                        .scrollIntoView({
                            block:
                                "nearest"
                        });

                    return;

                }


                /*
                   ARRIBA
                */

                if (
                    event.key === "ArrowUp"
                ) {

                    event.preventDefault();

                    indice =
                        indice < 0
                            ? opciones.length - 1
                            : Math.max(
                                indice - 1,
                                0
                            );

                    opciones[indice]
                        .focus();

                    opciones[indice]
                        .scrollIntoView({
                            block:
                                "nearest"
                        });

                    return;

                }


                /*
                   ENTER / OK
                */

                if (
                    event.key === "Enter" ||
                    event.key === "OK" ||
                    event.keyCode === 13 ||
                    event.keyCode === 23 ||
                    event.keyCode === 66
                ) {

                    event.preventDefault();

                    if (
                        actual &&
                        actual.classList
                            .contains(
                                "opcionFiltro"
                            )
                    ) {

                        actual.click();

                    }

                    return;

                }


                /*
                   ESC / BACK
                */

                if (
                    event.key === "Escape" ||
                    event.key === "Back"
                ) {

                    event.preventDefault();

                    cerrarTodosLosFiltros();

                }

            }
        );

    }
);

/* =========================================================
   MOSTRAR CONTENIDO
========================================================= */

function mostrarContenido() {

    const contenedor =
        document.getElementById(
            "peliculas"
        );


    const titulo =
        document.getElementById(
            "tituloCategoria"
        );


    /*
       BÚSQUEDA
    */

    const busqueda =
        inputBuscar.value
            .toLowerCase()
            .trim();


    /*
       FILTROS
    */

    const categoria =
        filtroActual.categoria;

    const desde =
        filtroActual.desde;

    const hasta =
        filtroActual.hasta;

    const tipo =
        filtroActual.tipo;


    /*
       UNIFICAMOS DATOS
    */

    let lista = [

        ...peliculas.map(
            pelicula => ({

                ...pelicula,

                _esSerie: false

            })
        ),

        ...series.map(
            serie => ({

                ...serie,

                _esSerie: true

            })
        )

    ];


    /* =====================================================
       FILTRO CATEGORÍA
    ===================================================== */

    if (
        categoria !==
        "TODAS"
    ) {

        lista =
            lista.filter(
                elemento => {

                    let categoriaElemento =
                        elemento.categoria;


                    /*
                       Compatibilidad
                       con "SERIES DE TERROR".
                    */

                    if (
                        categoriaElemento &&
                        categoriaElemento
                            .toUpperCase()
                            .trim() ===
                        "SERIES DE TERROR"
                    ) {

                        categoriaElemento =
                            "TERROR";

                    }


                    return (
                        categoriaElemento ===
                        categoria
                    );

                }
            );

    }


    /* =====================================================
       FILTRO DESDE / HASTA
    ===================================================== */

    lista =
        lista.filter(
            elemento => {

                const año =
                    parseInt(
                        elemento.año,
                        10
                    );


                if (
                    isNaN(año)
                ) {

                    return false;

                }


                return (
                    año >= desde &&
                    año <= hasta
                );

            }
        );


    /* =====================================================
       FILTRO TIPO
    ===================================================== */

    if (
        tipo ===
        "peliculas"
    ) {

        lista =
            lista.filter(
                elemento =>
                    !elemento._esSerie
            );

    }


    if (
        tipo ===
        "series"
    ) {

        lista =
            lista.filter(
                elemento =>
                    elemento._esSerie
            );

    }


    /* =====================================================
       FILTRO BÚSQUEDA
    ===================================================== */

    if (busqueda) {

        lista =
            lista.filter(
                elemento =>
                    elemento.titulo &&
                    elemento.titulo
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
            );

    }


    /* =====================================================
       CANTIDAD
    ===================================================== */

    const total =
        lista.length;


    /* =====================================================
       TÍTULO
    ===================================================== */

    const textoCategoria =
        categoria === "TODAS"
            ? "TODAS"
            : categoria;


    const textoTipo =

        tipo === "TODAS"
            ? "TODAS"
            : tipo === "peliculas"
                ? "PELÍCULAS"
                : "SERIES";


    titulo.textContent =

        textoCategoria +

        "  •  " +

        desde +

        "–" +

        hasta +

        "  •  " +

        textoTipo +

        "  •  " +

        total +

        " títulos";


    /* =====================================================
       LIMPIAR
    ===================================================== */

    contenedor.innerHTML =
        "";


    /* =====================================================
       SIN RESULTADOS
    ===================================================== */

    if (
        total === 0
    ) {

        contenedor.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#888;
            ">

                No se encontraron
                películas o series.

            </div>

        `;

        return;

    }


    /* =====================================================
       MOSTRAR RESULTADOS
    ===================================================== */

    lista.forEach(
        elemento => {

            crearTarjeta(
                elemento,
                elemento._esSerie
            );

        }
    );

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjeta(
    elemento,
    esSerie
) {

    const contenedor =
        document.getElementById(
            "peliculas"
        );


    const tarjeta =
        document.createElement(
            "div"
        );


    tarjeta.className =
        "pelicula";


    tarjeta.innerHTML = `

        <img
            class="poster"
            src="${elemento.poster}"
            loading="lazy"
            onerror="
                this.style.opacity='.3'
            "
        >

        <div class="info">

            <div class="nombre">

                ${elemento.titulo}

            </div>

            <div class="año">

                ${elemento.año}

            </div>

            <button class="ver">

                ${esSerie
                    ? "▶ SERIE"
                    : "▶ VER"}

            </button>

        </div>

    `;


    tarjeta
        .querySelector(
            ".ver"
        )
        .onclick = event => {

            event.stopPropagation();


            if (esSerie) {

                abrirSerie(
                    elemento
                );

            } else {

                reproducir(
                    elemento
                );

            }

        };


    tarjeta.onclick =
        () => {

            if (esSerie) {

                abrirSerie(
                    elemento
                );

            } else {

                reproducir(
                    elemento
                );

            }

        };


    contenedor.appendChild(
        tarjeta
    );

}

/* =========================================================
   REPRODUCIR
========================================================= */

function reproducir(
    pelicula
) {

    const url =
        pelicula.url
            .split("?")[0]
            .toLowerCase();


    /* ==========================================
       VLC NATIVO
       TV A LA CARTA
    ========================================== */

    if (
        url.endsWith(".mkv") ||
        url.endsWith(".mp4") ||
        url.endsWith(".avi") ||
        url.endsWith(".m3u8")
    ) {

        console.log(
            "TV A LA CARTA → VLC TVALC:",
            pelicula.titulo,
            pelicula.url
        );


        if (
            window.AndroidTVArg &&
            typeof AndroidTVArg.playChannelTVALC ===
            "function"
        ) {

            AndroidTVArg.playChannelTVALC(
                pelicula.url,
                pelicula.titulo
            );

            return;

        }


        console.log(
            "AndroidTVArg no disponible"
        );


        mostrarMensaje(
            "El reproductor nativo no está disponible."
        );

        return;

    }


    /* ==========================================
       OTROS → HTML
    ========================================== */

    const reproductor =
        document.getElementById(
            "reproductor"
        );

    const video =
        document.getElementById(
            "video"
        );


    document.getElementById(
        "tituloReproductor"
    ).textContent =

        pelicula.titulo +

        " (" +

        pelicula.año +

        ")";


    video.src =
        pelicula.url;


    reproductor.style.display =
        "flex";


    reproductorAbierto =
        true;

    reproduccionNativa =
        false;


    video.play().catch(
        () => {}
    );

}

   MENSAJE
========================================================= */

function mostrarMensaje(
    texto
) {

    const caja =
        document.getElementById(
            "mensajeReproductor"
        );


    const contenido =
        document.getElementById(
            "textoMensaje"
        );


    contenido.textContent =
        texto;


    caja.style.display =
        "block";


    setTimeout(
        () => {

            caja.style.display =
                "none";

        },
        3500
    );

}


/* =========================================================
   SERIES
========================================================= */

function abrirSerie(
    serie
) {

    const modal =
        document.getElementById(
            "modalSeries"
        );


    const titulo =
        document.getElementById(
            "modalSeriesTitulo"
        );


    const contenido =
        document.getElementById(
            "contenidoSeries"
        );


    titulo.textContent =
        serie.titulo;


    contenido.innerHTML =
        "";


    if (
        !serie.temporadas ||
        serie.temporadas.length === 0
    ) {

        contenido.innerHTML = `

            <div style="
                text-align:center;
                padding:30px;
                color:#888;
            ">

                No hay capítulos
                disponibles.

            </div>

        `;


        modal.style.display =
            "flex";


        return;

    }


    serie.temporadas.forEach(
        temporada => {

            const botonTemporada =
                document.createElement(
                    "button"
                );


            botonTemporada.className =
                "botonTemporada";


            botonTemporada.textContent =

                "▶ Temporada " +

                temporada.numero;


            const capitulos =
                document.createElement(
                    "div"
                );


            capitulos.className =
                "capitulos";


            temporada.capitulos.forEach(
                capitulo => {

                    const botonCapitulo =
                        document.createElement(
                            "button"
                        );


                    botonCapitulo.className =
                        "botonCapitulo";


                    botonCapitulo.textContent =

                        "▶ " +

                        (
                            capitulo.titulo ||
                            "Capítulo " +
                            capitulo.numero
                        );


                    botonCapitulo.onclick =
                        () => {

                            cerrarSeries();


                            reproducir(
                                {

                                    titulo:
                                        serie.titulo +

                                        " - T" +

                                        temporada.numero +

                                        "E" +

                                        capitulo.numero,

                                    año:
                                        serie.año,

                                    url:
                                        capitulo.url

                                }
                            );

                        };


                    capitulos.appendChild(
                        botonCapitulo
                    );

                }
            );


            botonTemporada.onclick =
                () => {

                    if (
                        capitulos.style.display ===
                        "block"
                    ) {

                        capitulos.style.display =
                            "none";

                    } else {

                        capitulos.style.display =
                            "block";

                    }

                };


            contenido.appendChild(
                botonTemporada
            );


            contenido.appendChild(
                capitulos
            );

        }
    );


    modal.style.display =
        "flex";

}


/* =========================================================
   CERRAR SERIES
========================================================= */

function cerrarSeries() {

    document.getElementById(
        "modalSeries"
    ).style.display =
        "none";

}


/* =========================================================
   BACK ANDROID
========================================================= */

window.addEventListener(
    "tvback",
    () => {

        console.log(
            "TVBACK recibido en TVALC"
        );


        /* ================================================
           1. FILTRO ABIERTO
        ================================================= */

        const hayFiltroAbierto =
            Object.values(
                filtrosPersonalizados
            ).some(
                filtro =>
                    filtro.contenedor
                        .classList
                        .contains(
                            "abierto"
                        )
            );


        if (hayFiltroAbierto) {

            cerrarTodosLosFiltros();

            return;

        }


        /* ================================================
           2. BUSCADOR ACTIVO
        ================================================= */

        if (busquedaActiva) {

            desactivarBusqueda();

            return;

        }


        /* ================================================
           3. MODAL SERIES
        ================================================= */

        const modalSeries =
            document.getElementById(
                "modalSeries"
            );


        if (
            modalSeries.style.display ===
            "flex"
        ) {

            cerrarSeries();

            return;

        }


        /* ================================================
           4. REPRODUCTOR WEB
        ================================================= */

        if (
            reproductorAbierto &&
            !reproduccionNativa
        ) {

            cerrarReproductor();

            return;

        }


        /* ================================================
           5. PANTALLA PRINCIPAL
        ================================================= */

        volverTVArg();

    }
);


/* =========================================================
   BACK TECLADO — PC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" ||
            event.key === "Back" ||
            event.keyCode === 4
        ) {

            event.preventDefault();


            /* ============================================
               FILTROS
            ============================================ */

            const hayFiltroAbierto =
                Object.values(
                    filtrosPersonalizados
                ).some(
                    filtro =>
                        filtro.contenedor
                            .classList
                            .contains(
                                "abierto"
                            )
                );


            if (hayFiltroAbierto) {

                cerrarTodosLosFiltros();

                return;

            }


            /* ============================================
               BUSCADOR
            ============================================ */

            if (busquedaActiva) {

                desactivarBusqueda();

                return;

            }


            /* ============================================
               REPRODUCTOR WEB
            ============================================ */

            if (
                reproductorAbierto &&
                !reproduccionNativa
            ) {

                cerrarReproductor();

                return;

            }


            /* ============================================
               MODAL SERIES
            ============================================ */

            const modalSeries =
                document.getElementById(
                    "modalSeries"
                );


            if (
                modalSeries.style.display ===
                "flex"
            ) {

                cerrarSeries();

                return;

            }


            /* ============================================
               PRINCIPAL TVALC
            ============================================ */

            volverTVArg();

        }

    }
);


/* =========================================================
   CERRAR MODAL SERIES AL TOCAR FONDO
========================================================= */

document.getElementById(
    "modalSeries"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            cerrarSeries();

        }

    }
);


/* =========================================================
   MANEJAR ERRORES DEL VIDEO WEB
========================================================= */

document.getElementById(
    "video"
).addEventListener(
    "error",
    function() {

        mostrarMensaje(
            "No se pudo reproducir este contenido."
        );

    }
);

cargarFiltroCategoria();

cargarFiltrosAños();

cargarFiltroTipo();

actualizarListasSeleccionadas();

mostrarContenido();

</script>
