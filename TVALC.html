<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   CABECERA
========================================================= */

header {

    padding:
        34px 20px 15px;

    text-align: center;

    background:
        linear-gradient(
            to bottom,
            #181818,
            #090909
        );

    border-bottom: 1px solid #292929;
}

header h1 {

    margin: 0;

    font-size: 28px;

    letter-spacing: .5px;
}

header p {

    margin:
        6px 0 0;

    color: #999;

    font-size: 14px;
}


/* =========================================================
   VOLVER A TVARG
========================================================= */

#volverTVArg {

    position: fixed;

    top: 12px;
    left: 12px;

    z-index: 2000;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        rgba(0,0,0,.72);

    color: white;

    font-size: 21px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}

#volverTVArg:hover {

    background: #333;

}

body.android-app #volverTVArg {

    display: none !important;

}


/* =========================================================
   BUSCADOR
========================================================= */

.buscador {

    width: 100%;

    padding:
        13px 15px 8px;

    display: flex;

    justify-content: center;

    position: relative;
}

#buscar {

    width:
        min(560px, 94%);

    height: 42px;

    padding:
        9px 18px;

    border-radius: 22px;

    border:
        1px solid #3d3d3d;

    background: #151515;

    color: white;

    font-size: 15px;

    outline: none;
}

#buscar:focus {

    border-color: #777;

}


/*
   Cuando el campo está bloqueado:

   - puede recibir foco
   - no abre teclado
   - se activa con OK / Enter
*/

#buscar.bloqueado {

    color: #aaa;

    border-color: #333;

}


/* =========================================================
   CATEGORÍAS
========================================================= */

.categorias {

    width: 100%;

    display: flex;

    gap: 7px;

    padding:
        7px 14px 14px;

    overflow-x: auto;

    overflow-y: hidden;

    justify-content: flex-start;

    scrollbar-width: thin;

    -webkit-overflow-scrolling: touch;

    white-space: nowrap;
}

.categorias::-webkit-scrollbar {

    height: 4px;

}

.categorias::-webkit-scrollbar-thumb {

    background: #444;

    border-radius: 4px;

}

.categorias button {

    flex:
        0 0 auto;

    border:
        1px solid #333;

    border-radius: 18px;

    padding:
        8px 13px;

    background: #1d1d1d;

    color: #ddd;

    cursor: pointer;

    white-space: nowrap;

    font-size: 12px;

    transition: .15s;
}

.categorias button:hover {

    background: #333;

}

.categorias button.activo {

    background: #e50914;

    border-color: #e50914;

    color: white;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor {

    width: 100%;

    max-width: 1500px;

    margin: auto;

    padding:
        4px 16px 35px;
}

.tituloCategoria {

    font-size: 18px;

    font-weight: bold;

    margin:
        8px 0 13px;

    color: #ddd;
}


/* =========================================================
   GRILLA
========================================================= */

.peliculas {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(105px, 1fr)
        );

    gap:
        13px;
}


/* =========================================================
   TARJETA
========================================================= */

.pelicula {

    position: relative;

    background: #111;

    border-radius: 6px;

    overflow: hidden;

    cursor: pointer;

    transition:
        transform .15s,
        box-shadow .15s;
}

.pelicula:hover {

    transform: scale(1.035);

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.8);
}

.poster {

    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    display: block;

    background: #202020;
}


/* =========================================================
   MARCA P / S
========================================================= */

.tipoContenido {

    position: absolute;

    top: 5px;
    right: 5px;

    z-index: 3;

    min-width: 21px;
    height: 21px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 4px;

    background:
        rgba(0,0,0,.82);

    border:
        1px solid
        rgba(255,255,255,.3);

    color: white;

    font-size: 11px;

    font-weight: bold;
}


/* =========================================================
   INFORMACIÓN
========================================================= */

.info {

    padding:
        6px 7px 7px;
}

.nombre {

    font-size: 11px;

    font-weight: bold;

    line-height: 1.2;

    min-height:
        26px;

    overflow: hidden;
}

.año {

    color: #888;

    font-size: 10px;

    margin-top: 3px;
}


/*
   El botón queda pequeño.
   La tarjeta completa también es clickeable.
*/

.ver {

    width: 100%;

    margin-top: 5px;

    padding: 5px;

    border: none;

    border-radius: 4px;

    background: #e50914;

    color: white;

    font-size: 10px;

    font-weight: bold;

    cursor: pointer;
}

.ver:hover {

    background: #ff202b;

}


/* =========================================================
   REPRODUCTOR WEB
========================================================= */

#reproductor {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 6000;

    background:
        rgba(0,0,0,.97);

    align-items: center;

    justify-content: center;

    flex-direction: column;
}

#video {

    width: 90%;

    max-width: 1100px;

    max-height: 80vh;

    background: black;
}

#tituloReproductor {

    margin:
        10px;

    font-size: 19px;

    text-align: center;
}


/* =========================================================
   MENSAJE
========================================================= */

#mensajeReproductor {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 7000;

    width:
        min(90%, 500px);

    padding: 20px;

    border-radius: 10px;

    background:
        rgba(20,20,20,.96);

    border:
        1px solid #444;

    text-align: center;

    color: #ddd;
}


/* =========================================================
   MODAL SERIES
========================================================= */

#modalSeries {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    background:
        rgba(0,0,0,.94);

    align-items: center;

    justify-content: center;
}

#modalSeriesCaja {

    width:
        min(90%, 700px);

    max-height: 85vh;

    overflow-y: auto;

    background: #111;

    border:
        1px solid #333;

    border-radius: 14px;

    padding: 22px;
}

#modalSeriesTitulo {

    text-align: center;

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 17px;
}


/* =========================================================
   TEMPORADAS
========================================================= */

.botonTemporada {

    width: 100%;

    margin:
        5px 0;

    padding: 12px;

    background: #222;

    color: white;

    border:
        1px solid #444;

    border-radius: 7px;

    font-size: 15px;

    cursor: pointer;

    text-align: left;
}

.botonTemporada:hover {

    background: #333;
}


/* =========================================================
   CAPÍTULOS
========================================================= */

.capitulos {

    display: none;

    margin:
        0 0 10px;
}

.botonCapitulo {

    width: 100%;

    margin:
        3px 0;

    padding: 9px;

    background: #191919;

    color: #ddd;

    border:
        1px solid #333;

    border-radius: 6px;

    text-align: left;

    cursor: pointer;

    font-size: 13px;
}

.botonCapitulo:hover {

    background: #292929;

}


/* =========================================================
   CANCELAR
========================================================= */

#cancelarSeries {

    width: 100%;

    margin-top: 16px;

    padding: 11px;

    border: 1px solid #444;

    border-radius: 8px;

    background: #222;

    color: #ddd;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    background: #333;

/* =========================================================
   PC GRANDE
========================================================= */

button:focus,
input:focus {

/* =========================================================
   VOLVER A TVARG
========================================================= */

function volverTVArg() {

    window.location.href =
        "index.html?desdeTVALC=1";

}


/* =========================================================
   CATEGORÍAS
========================================================= */

function cargarCategorias() {

    const contenedor =
        document.getElementById(
            "categorias"
        );

    contenedor.innerHTML =
        "";

    generos.forEach(
        categoria => {

            const boton =
                document.createElement(
                    "button"
                );

            boton.textContent =
                categoria;

            if (
                categoria ===
                categoriaActual
            ) {

                boton.classList.add(
                    "activo"
                );

            }

            boton.onclick =
                () => {

                    categoriaActual =
                        categoria;

                    nivelTVALC =
                        "categoria";

                    cargarCategorias();

                    mostrarContenido();

                };

            contenedor.appendChild(
                boton
            );

        }
    );

}


/* =========================================================
   MOSTRAR CONTENIDO
========================================================= */

function mostrarContenido() {

    const contenedor =
        document.getElementById(
            "peliculas"
        );

    const titulo =
        document.getElementById(
            "tituloCategoria"
        );

    const input =
        document.getElementById(
            "buscar"
        );

    const busqueda =
        input.value
            .toLowerCase()
            .trim();


    let listaPeliculas =
        peliculas;

    let listaSeries =
        series;


    /* =====================================================
       FILTRO POR GÉNERO
    ===================================================== */

    if (
        categoriaActual !==
        "TODAS"
    ) {

        listaPeliculas =
            listaPeliculas.filter(
                p =>
                    p.categoria ===
                    categoriaActual
            );

        listaSeries =
            listaSeries.filter(
                s =>
                    s.categoria ===
                    categoriaActual
            );

    }


    /* =====================================================
       FILTRO POR BÚSQUEDA
    ===================================================== */

    if (busqueda) {

        listaPeliculas =
            listaPeliculas.filter(
                p =>
                    p.titulo
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
            );

        listaSeries =
            listaSeries.filter(
                s =>
                    s.titulo
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
            );

    }


    const total =
        listaPeliculas.length +
        listaSeries.length;


    titulo.textContent =

        categoriaActual +

        "  •  " +

        total +

        " títulos";


    contenedor.innerHTML =
        "";


    if (
        total === 0
    ) {

        contenedor.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:45px 20px;
                color:#777;
            ">

                No se encontraron
                películas o series.

            </div>

        `;

        return;

    }


    /* =====================================================
       PELÍCULAS
    ===================================================== */

    listaPeliculas.forEach(
        pelicula => {

            crearTarjeta(
                pelicula,
                false
            );

        }
    );


    /* =====================================================
       SERIES
    ===================================================== */

    listaSeries.forEach(
        serie => {

            crearTarjeta(
                serie,
                true
            );

        }
    );

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjeta(
    elemento,
    esSerie
) {

    const contenedor =
        document.getElementById(
            "peliculas"
        );

    const tarjeta =
        document.createElement(
            "div"
        );

    tarjeta.className =
        "pelicula";


    const tipo =
        esSerie
            ? "S"
            : "P";


    tarjeta.innerHTML = `

        <div class="tipoContenido">
            ${tipo}
        </div>

        <img
            class="poster"
            src="${elemento.poster}"
            loading="lazy"
            onerror="
                this.style.opacity='.3'
            "
        >

        <div class="info">

            <div class="nombre">
                ${elemento.titulo}
            </div>

            <div class="año">
                ${elemento.año}
            </div>

            <button class="ver">

                ${esSerie
                    ? "▶ SERIE"
                    : "▶ VER"}

            </button>

        </div>

    `;


    tarjeta
        .querySelector(
            ".ver"
        )
        .onclick =
            event => {

                event.stopPropagation();

                if (esSerie) {

                    abrirSerie(
                        elemento
                    );

                } else {

                    reproducir(
                        elemento
                    );

                }

            };


    tarjeta.onclick =
        () => {

            if (esSerie) {

                abrirSerie(
                    elemento
                );

            } else {

                reproducir(
                    elemento
                );

            }

        };


    contenedor.appendChild(
        tarjeta
    );

}


/* =========================================================
   BUSCADOR
========================================================= */

function filtrar() {

    if (!buscadorActivo) {
        return;
    }

    mostrarContenido();

}


/*
   Activar el buscador.

   Se utiliza Enter / OK.
*/

function activarBuscador() {

    const input =
        document.getElementById(
            "buscar"
        );

    buscadorActivo =
        true;

    input.classList.remove(
        "bloqueado"
    );

    input.focus();

}


/*
   Al perder el foco volvemos
   al estado bloqueado.
*/

document.getElementById(
    "buscar"
).addEventListener(
    "blur",
    function() {

        buscadorActivo =
            false;

        this.classList.add(
            "bloqueado"
        );

    }
);


/*
   Primera pulsación sobre el campo:
   no se abre el teclado.

   OK / Enter:
   activa realmente la edición.
*/

document.getElementById(
    "buscar"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === "OK" ||
            event.keyCode === 13
        ) {

            event.preventDefault();

            activarBuscador();

        }

    }
);


/*
   Evita que un toque accidental
   abra inmediatamente el teclado
   cuando se está navegando.
*/

document.getElementById(
    "buscar"
).addEventListener(
    "click",
    function(event) {

        if (!buscadorActivo) {

            event.preventDefault();

            this.blur();

        }

    }
);


/* =========================================================
   REPRODUCIR
========================================================= */

function reproducir(pelicula) {

    const url =
        pelicula.url
            .split("?")[0]
            .toLowerCase();


    /*
       Archivos compatibles con
       reproducción nativa VLC.
    */

    if (
        url.endsWith(".mkv") ||
        url.endsWith(".mp4") ||
        url.endsWith(".avi") ||
        url.endsWith(".m3u8")
    ) {

        console.log(
            "TV A LA CARTA → VLC:",
            pelicula.titulo,
            pelicula.url
        );


        if (
            window.AndroidTVArg &&
            typeof AndroidTVArg.playChannelVLC ===
            "function"
        ) {

            AndroidTVArg.playChannelVLC(
                pelicula.url
            );

            return;

        }


        console.log(
            "AndroidTVArg no disponible"
        );

        return;

    }


    reproducirWeb(
        pelicula
    );

}


/* =========================================================
   REPRODUCCIÓN ANDROID
========================================================= */

function reproducirEnAndroid(
    pelicula
) {

    console.log(
        "TVALC -> AndroidTVArg.playChannel:",
        pelicula.titulo,
        pelicula.url
    );


    if (!window.AndroidTVArg) {

        console.error(
            "TVArgBridge no está disponible"
        );

        reproductorAbierto =
            false;

        reproduccionNativa =
            false;

        mostrarMensaje(
            "TVArgBridge no está disponible."
        );

        return;

    }


    try {

        AndroidTVArg.playChannel(
            pelicula.url,
            "",
            ""
        );

    } catch (error) {

        console.error(
            "Error iniciando PlayerActivity:",
            error
        );

        reproductorAbierto =
            false;

        reproduccionNativa =
            false;

        mostrarMensaje(
            "No se pudo iniciar el reproductor."
        );

    }

}

   REPRODUCCIÓN WEB
========================================================= */

function reproducirWeb(
    pelicula
) {

    const reproductor =
        document.getElementById(
            "reproductor"
        );

    const video =
        document.getElementById(
            "video"
        );


    document.getElementById(
        "tituloReproductor"
    ).textContent =

        pelicula.titulo +

        " (" +

        pelicula.año +

        ")";


    video.src =
        pelicula.url;


    reproductor.style.display =
        "flex";


    reproductorAbierto =
        true;

    reproduccionNativa =
        false;


    video.play()
        .catch(
            error => {

                console.log(
                    "Autoplay bloqueado:",
                    error
                );

            }
        );

}


/* =========================================================
   MANEJAR SALIDA DEL PLAYER NATIVO
========================================================= */

function manejarSalidaCanal() {

    console.log(
        "PlayerActivity finalizada -> TVALC"
    );


    reproductorAbierto =
        false;

    reproduccionNativa =
        false;

}


/* =========================================================
   CERRAR REPRODUCTOR WEB
========================================================= */

function cerrarReproductor() {

    const reproductor =
        document.getElementById(
            "reproductor"
        );

    const video =
        document.getElementById(
            "video"
        );


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    reproductor.style.display =
        "none";


    reproductorAbierto =
        false;

}


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
    texto
) {

    const caja =
        document.getElementById(
            "mensajeReproductor"
        );

    const contenido =
        document.getElementById(
            "textoMensaje"
        );


    contenido.textContent =
        texto;


    caja.style.display =
        "block";


    setTimeout(
        () => {

            caja.style.display =
                "none";

        },
        3500
    );

}


/* =========================================================
   SERIES
========================================================= */

function abrirSerie(
    serie
) {

    const modal =
        document.getElementById(
            "modalSeries"
        );

    const titulo =
        document.getElementById(
            "modalSeriesTitulo"
        );

    const contenido =
        document.getElementById(
            "contenidoSeries"
        );


    titulo.textContent =
        serie.titulo;


    contenido.innerHTML =
        "";


    if (
        !serie.temporadas ||
        serie.temporadas.length === 0
    ) {

        contenido.innerHTML = `

            <div style="
                text-align:center;
                padding:30px;
                color:#888;
            ">

                No hay capítulos
                disponibles.

            </div>

        `;


        modal.style.display =
            "flex";

        return;

    }


    serie.temporadas.forEach(
        temporada => {

            const botonTemporada =
                document.createElement(
                    "button"
                );


            botonTemporada.className =
                "botonTemporada";


            botonTemporada.textContent =

                "▶ Temporada " +

                temporada.numero;


            const capitulos =
                document.createElement(
                    "div"
                );


            capitulos.className =
                "capitulos";


            temporada.capitulos.forEach(
                capitulo => {

                    const botonCapitulo =
                        document.createElement(
                            "button"
                        );


                    botonCapitulo.className =
                        "botonCapitulo";


                    botonCapitulo.textContent =

                        "▶ " +

                        (
                            capitulo.titulo ||
                            "Capítulo " +
                            capitulo.numero
                        );


                    botonCapitulo.onclick =
                        () => {

                            cerrarSeries();


                            reproducir(
                                {

                                    titulo:
                                        serie.titulo +

                                        " - T" +

                                        temporada.numero +

                                        "E" +

                                        capitulo.numero,

                                    año:
                                        serie.año,

                                    url:
                                        capitulo.url

                                }
                            );

                        };


                    capitulos.appendChild(
                        botonCapitulo
                    );

                }
            );


            botonTemporada.onclick =
                () => {

                    if (
                        capitulos.style.display ===
                        "block"
                    ) {

                        capitulos.style.display =
                            "none";

                    } else {

                        capitulos.style.display =
                            "block";

                    }

                };


            contenido.appendChild(
                botonTemporada
            );


            contenido.appendChild(
                capitulos
            );

        }
    );


    modal.style.display =
        "flex";

}


/* =========================================================
   CERRAR SERIES
========================================================= */

function cerrarSeries() {

    document.getElementById(
        "modalSeries"
    ).style.display =
        "none";

}


/* =========================================================
   VOLVER DE CATEGORÍA
========================================================= */

function volverDeCategoria() {

    categoriaActual =
        "TODAS";

    nivelTVALC =
        "principal";


    document.getElementById(
        "buscar"
    ).value =
        "";


    buscadorActivo =
        false;


    document.getElementById(
        "buscar"
    ).classList.add(
        "bloqueado"
    );


    cargarCategorias();

    mostrarContenido();

}


/* =========================================================
   INICIO
========================================================= */

cargarCategorias();

mostrarContenido();


/* =========================================================
   BACK ANDROID
========================================================= */

window.addEventListener(
    "tvback",
    () => {

        console.log(
            "TVBACK recibido en TVALC"
        );


        /* ================================================
           MODAL SERIES
        ================================================= */

        const modalSeries =
            document.getElementById(
                "modalSeries"
            );


        if (
            modalSeries.style.display ===
            "flex"
        ) {

            cerrarSeries();

            return;

        }


        /* ================================================
           REPRODUCTOR WEB
        ================================================= */

        if (
            reproductorAbierto &&
            !reproduccionNativa
        ) {

            cerrarReproductor();

            return;

        }


        /* ================================================
           BUSCADOR
        ================================================= */

        if (buscadorActivo) {

            document.getElementById(
                "buscar"
            ).blur();

            buscadorActivo =
                false;

            return;

        }


        /* ================================================
           CATEGORÍA
        ================================================= */

        if (
            nivelTVALC ===
            "categoria"
        ) {

            volverDeCategoria();

            return;

        }


        /* ================================================
           PRINCIPAL
        ================================================= */

        volverTVArg();

    }
);


/* =========================================================
   BACK TECLADO PC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" ||
            event.key === "Back" ||
            event.keyCode === 4
        ) {

            event.preventDefault();


            /* ============================================
               REPRODUCTOR WEB
            ============================================ */

            if (
                reproductorAbierto &&
                !reproduccionNativa
            ) {

                cerrarReproductor();

                return;

            }


            /* ============================================
               MODAL SERIES
            ============================================ */

            const modalSeries =
                document.getElementById(
                    "modalSeries"
                );


            if (
                modalSeries.style.display ===
                "flex"
            ) {

                cerrarSeries();

                return;

            }


            /* ============================================
               BUSCADOR
            ============================================ */

            if (buscadorActivo) {

                document.getElementById(
                    "buscar"
                ).blur();

                buscadorActivo =
                    false;

                return;

            }


            /* ============================================
               CATEGORÍA
            ============================================ */

            if (
                nivelTVALC ===
                "categoria"
            ) {

                volverDeCategoria();

                return;

            }


            /* ============================================
               PRINCIPAL
            ============================================ */

            volverTVArg();

        }

    }
);


/* =========================================================
   CERRAR MODAL TOCANDO EL FONDO
========================================================= */

document.getElementById(
    "modalSeries"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            cerrarSeries();

        }

    }
);


/* =========================================================
   ERROR VIDEO WEB
========================================================= */

document.getElementById(
    "video"
).addEventListener(
    "error",
    function() {

        mostrarMensaje(
            "No se pudo reproducir este contenido."
        );

    }
);

</script>
