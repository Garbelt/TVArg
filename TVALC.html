<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVArg - TV A LA CARTA</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================================================
   CABECERA
========================================================= */

header {

    padding: 20px;

    text-align: center;

    background:
        linear-gradient(
            to bottom,
            #181818,
            #090909
        );

    border-bottom: 1px solid #333;
}

header h1 {

    margin: 0;

    font-size: 28px;

}

header p {

    margin: 6px 0 0;

    color: #aaa;

}


/* =========================================================
   VOLVER A TVARG
   SOLO PC / CELULAR
========================================================= */

#volverTVArg {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 2000;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.65);

    color: white;

    font-size: 22px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: .2s;
}

#volverTVArg:hover {

    background:
        rgba(50,50,50,.9);

    transform: scale(1.08);

}


/* =========================================================
   BUSCADOR
========================================================= */

.buscador {

    padding: 15px;

    display: flex;

    justify-content: center;
}

#buscar {

    width: min(600px,95%);

    padding: 13px 18px;

    border-radius: 25px;

    border: 1px solid #444;

    background: #171717;

    color: white;

    font-size: 16px;

    outline: none;
}

#buscar:focus {

    border-color: #777;

}


/* =========================================================
   CATEGORÍAS
========================================================= */

.categorias {

    display: flex;

    gap: 8px;

    padding:
        5px
        15px
        20px;

    overflow-x: auto;

    justify-content: center;

}

.categorias button {

    border: none;

    border-radius: 20px;

    padding:
        9px
        16px;

    background: #222;

    color: white;

    cursor: pointer;

    white-space: nowrap;

}

.categorias button:hover {

    background: #444;

}

.categorias button.activo {

    background: #e50914;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor {

    width: 100%;

    max-width: 1400px;

    margin: auto;

    padding:
        10px
        20px
        40px;

}

.tituloCategoria {

    font-size: 22px;

    margin:
        10px
        0
        18px;

}


/* =========================================================
   PELÍCULAS
========================================================= */

.peliculas {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px,1fr)
        );

    gap: 22px;

}


/* =========================================================
   TARJETA
========================================================= */

.pelicula {

    background: #111;

    border-radius: 8px;

    overflow: hidden;

    transition:
        transform .2s,
        box-shadow .2s;

    cursor: pointer;

}

.pelicula:hover {

    transform: scale(1.04);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.7);

}

.poster {

    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    display: block;

    background: #222;

}

.info {

    padding: 10px;

}

.nombre {

    font-size: 15px;

    font-weight: bold;

    line-height: 1.25;

}

.año {

    color: #aaa;

    font-size: 13px;

    margin-top: 5px;

}

.ver {

    width: 100%;

    margin-top: 10px;

    padding: 9px;

    border: none;

    border-radius: 5px;

    background: #e50914;

    color: white;

    font-weight: bold;

    cursor: pointer;

}

.ver:hover {

    background: #ff202b;

}


/* =========================================================
   REPRODUCTOR
========================================================= */

#reproductor {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 10000;

    background:
        rgba(0,0,0,.96);

    align-items: center;

    justify-content: center;

    flex-direction: column;

}

#video {

    width: 90%;

    max-width: 1100px;

    max-height: 80vh;

    background: black;

}

#tituloReproductor {

    margin: 10px;

    font-size: 20px;

    text-align: center;

}


/* =========================================================
   INDICADOR DE NAVEGACIÓN DEL REPRODUCTOR
========================================================= */

#mensajeReproductor {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    color: #aaa;

    font-size: 14px;

    pointer-events: none;

}


/* =========================================================
   MODAL SERIES
========================================================= */

#modalSerie {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 9000;

    background:
        rgba(0,0,0,.92);

    align-items: center;

    justify-content: center;

    padding: 20px;

}

#modalSerieCaja {

    width: min(900px,95vw);

    max-height: 90vh;

    overflow-y: auto;

    background: #111;

    border:
        1px solid
        #333;

    border-radius: 14px;

    padding: 25px;

}

#modalSerieTitulo {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    margin-bottom: 20px;

}

#temporadas {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-bottom: 20px;

}

.botonTemporada {

    padding: 10px 16px;

    border: none;

    border-radius: 8px;

    background: #222;

    color: white;

    cursor: pointer;

}

.botonTemporada.activa {

    background: #e50914;

}

#capitulos {

    display: flex;

    flex-direction: column;

    gap: 8px;

}

.botonCapitulo {

    width: 100%;

    padding: 13px;

    text-align: left;

    border:
        1px solid
        #333;

    border-radius: 8px;

    background: #1b1b1b;

    color: white;

    cursor: pointer;

}

.botonCapitulo:hover {

    background: #292929;

}


/* =========================================================
   CERRAR MODAL SERIES
========================================================= */

#cerrarSerie {

    display: block;

    width: 100%;

    margin-top: 20px;

    padding: 11px;

    border: none;

    border-radius: 8px;

    background: #333;

    color: white;

    cursor: pointer;

}


/* =========================================================
   ANDROID
========================================================= */

/*
   En Android / TV Stick el botón gráfico
   de volver NO debe aparecer.
*/

body.android-app #volverTVArg {

    display: none !important;

}


/* =========================================================
   TV STICK
========================================================= */

/*
   Los TV Stick suelen tener una resolución grande
   pero una interfaz WebView donde los elementos
   terminan visualmente demasiado grandes.

   Compactamos solamente pantallas grandes
   de poca altura.
*/

@media
(min-width: 900px)
and (max-height: 800px) {

    header {

        padding:
            10px
            15px;

    }

    header h1 {

        font-size: 22px;

    }

    header p {

        margin-top: 3px;

        font-size: 13px;

    }

    .buscador {

        padding:
            8px
            15px;

    }

    #buscar {

        padding:
            8px
            14px;

        font-size: 14px;

        max-width: 450px;

    }

    .categorias {

        padding:
            3px
            12px
            10px;

        gap: 6px;

    }

    .categorias button {

        padding:
            7px
            12px;

        font-size: 12px;

    }

    .contenedor {

        padding:
            5px
            15px
            25px;

    }

    .tituloCategoria {

        font-size: 18px;

        margin:
            6px
            0
            12px;

    }

    .peliculas {

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(125px,1fr)
            );

        gap: 12px;

    }

    .info {

        padding: 7px;

    }

    .nombre {

        font-size: 12px;

    }

    .año {

        font-size: 11px;

        margin-top: 3px;

    }

    .ver {

        margin-top: 6px;

        padding: 6px;

        font-size: 11px;

    }

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width:600px) {

    header h1 {

        font-size: 23px;

    }

    .peliculas {

        grid-template-columns:
            repeat(2,1fr);

        gap: 12px;

    }

    .contenedor {

        padding:
            5px
            10px
            30px;

    }

    .nombre {

        font-size: 14px;

    }

}


/* =========================================================
   ANDROID TV CON PANTALLA MUY GRANDE
========================================================= */

@media
(min-width: 1200px)
and (min-height: 700px)
and (max-height: 1000px) {

    .peliculas {

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(150px,1fr)
            );

        gap: 15px;

    }

    .contenedor {

        padding-left: 18px;
        padding-right: 18px;

    }

}


/* =========================================================
   ESTADO DE FOCO PARA TV
========================================================= */

.tv-focus {

    outline:
        3px solid
        #ffffff !important;

    outline-offset: 3px;

    transform:
        scale(1.03);

    z-index: 5;

}

/* =========================================================
   SERIES
   ESTRUCTURA PREPARADA
========================================================= */

/*
   Todavía no agregamos series reales al catálogo.

   La estructura será:

   {
       tipo: "serie",
       titulo: "...",
       año: "...",
       categoria: "SERIES",
       poster: "...",

       temporadas: [

           {
               numero: 1,

               capitulos: [

                   {
                       numero: 1,
                       titulo: "...",
                       url: "..."
                   }

               ]
           }

       ]
   }

*/

const series = [];


/* =========================================================
   ESTADO DE NAVEGACIÓN
========================================================= */

let categoriaActual = "TODAS";

let nivelNavegacion = "principal";

let serieActual = null;

let temporadaActual = null;


/*
   Estados posibles:

   principal
   categoria
   serie
   reproductor
*/


/* =========================================================
   VOLVER A TVARG
========================================================= */

function volverTVArg() {

    /*
       Indicamos al APK que volvemos al menú principal.
    */

    if (window.AndroidTVArg) {

        try {

            AndroidTVArg.setMenuPrincipal(true);

        } catch (e) {}

    }


    /*
       El parámetro permite que index.html
       sepa que venimos desde TVALC.
    */

    window.location.href =
        "index.html?desde=tvalc";

}


/* =========================================================
   CATEGORÍAS
========================================================= */

function cargarCategorias() {

    const contenedor =
        document.getElementById("categorias");


    const categorias = [

        "TODAS",

        ...new Set(
            [
                ...peliculas,
                ...series
            ]
            .map(p => p.categoria)
        )

    ];


    contenedor.innerHTML = "";


    categorias.forEach(categoria => {

        const boton =
            document.createElement("button");


        boton.textContent =
            categoria;


        if (
            categoria ===
            categoriaActual
        ) {

            boton.classList.add("activo");

        }


        boton.onclick = () => {

            categoriaActual =
                categoria;

            nivelNavegacion =
                categoria === "TODAS"
                ? "principal"
                : "categoria";

            cargarCategorias();

            mostrarPeliculas();

        };


        contenedor.appendChild(boton);

    });

}


/* =========================================================
   MOSTRAR PELÍCULAS / SERIES
========================================================= */

function mostrarPeliculas() {

    const contenedor =
        document.getElementById("peliculas");

    const titulo =
        document.getElementById(
            "tituloCategoria"
        );

    const busqueda =
        document
            .getElementById("buscar")
            .value
            .toLowerCase()
            .trim();


    let lista = [

        ...peliculas,
        ...series

    ];


    /* FILTRO CATEGORÍA */

    if (
        categoriaActual !==
        "TODAS"
    ) {

        lista =
            lista.filter(
                p =>
                    p.categoria ===
                    categoriaActual
            );

    }


    /* FILTRO BÚSQUEDA */

    if (busqueda) {

        lista =
            lista.filter(
                p =>
                    p.titulo
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
            );

    }


    titulo.textContent =

        categoriaActual +

        " • " +

        lista.length;


    contenedor.innerHTML = "";


    if (!lista.length) {

        contenedor.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#888;
            ">

                No se encontraron
                contenidos.

            </div>

        `;

        return;

    }


    lista.forEach(item => {

        const tarjeta =
            document.createElement("div");


        tarjeta.className =
            "pelicula";


        tarjeta.innerHTML = `

            <img
                class="poster"
                src="${item.poster}"
                loading="lazy"
                onerror="
                    this.style.opacity='.3'
                "
            >

            <div class="info">

                <div class="nombre">
                    ${item.titulo}
                </div>

                <div class="año">
                    ${item.año}
                </div>

                <button class="ver">
                    ▶ VER
                </button>

            </div>

        `;


        tarjeta
            .querySelector(".ver")
            .onclick = () =>
                seleccionarContenido(item);


        contenedor.appendChild(
            tarjeta
        );

    });

}


/* =========================================================
   SELECCIONAR CONTENIDO
========================================================= */

function seleccionarContenido(item) {

    if (
        item.tipo === "serie"
    ) {

        abrirModalSerie(item);

        return;

    }


    reproducir(item);

}


/* =========================================================
   BÚSQUEDA
========================================================= */

function filtrar() {

    mostrarPeliculas();

}


/* =========================================================
   REPRODUCIR
========================================================= */

function reproducir(item) {

    const reproductor =
        document.getElementById(
            "reproductor"
        );

    const video =
        document.getElementById(
            "video"
        );


    document.getElementById(
        "tituloReproductor"
    ).textContent =

        item.titulo +

        (
            item.año
            ? " (" + item.año + ")"
            : ""
        );


    video.src =
        item.url;


    reproductor.style.display =
        "flex";


    nivelNavegacion =
        "reproductor";


    video.play()
        .catch(() => {});

}


/* =========================================================
   CERRAR REPRODUCTOR
========================================================= */

function cerrarReproductor() {

    const reproductor =
        document.getElementById(
            "reproductor"
        );

    const video =
        document.getElementById(
            "video"
        );


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    reproductor.style.display =
        "none";


    nivelNavegacion =
        "principal";

}


/* =========================================================
   MODAL DE SERIES
========================================================= */

function abrirModalSerie(serie) {

    serieActual =
        serie;


    temporadaActual =
        serie.temporadas?.[0] ||
        null;


    document.getElementById(
        "modalSerieTitulo"
    ).textContent =
        serie.titulo;


    document.getElementById(
        "modalSerie"
    ).style.display =
        "flex";


    nivelNavegacion =
        "serie";


    mostrarTemporadas();

}


/* =========================================================
   TEMPORADAS
========================================================= */

function mostrarTemporadas() {

    const contenedor =
        document.getElementById(
            "temporadas"
        );


    contenedor.innerHTML = "";


    if (
        !serieActual ||
        !serieActual.temporadas
    ) {

        return;

    }


    serieActual.temporadas
        .forEach(temporada => {

            const boton =
                document.createElement(
                    "button"
                );


            boton.className =
                "botonTemporada";


            if (
                temporada ===
                temporadaActual
            ) {

                boton.classList.add(
                    "activa"
                );

            }


            boton.textContent =
                "Temporada " +
                temporada.numero;


            boton.onclick = () => {

                temporadaActual =
                    temporada;

                mostrarTemporadas();

                mostrarCapitulos();

            };


            contenedor.appendChild(
                boton
            );

        });


    mostrarCapitulos();

}


/* =========================================================
   CAPÍTULOS
========================================================= */

function mostrarCapitulos() {

    const contenedor =
        document.getElementById(
            "capitulos"
        );


    contenedor.innerHTML = "";


    if (
        !temporadaActual ||
        !temporadaActual.capitulos
    ) {

        return;

    }


    temporadaActual.capitulos
        .forEach(capitulo => {

            const boton =
                document.createElement(
                    "button"
                );


            boton.className =
                "botonCapitulo";


            boton.textContent =

                "Capítulo " +
                capitulo.numero +
                " — " +
                capitulo.titulo;


            boton.onclick = () => {

                reproducir({

                    titulo:
                        serieActual.titulo +
                        " - " +
                        capitulo.titulo,

                    url:
                        capitulo.url

                });

            };


            contenedor.appendChild(
                boton
            );

        });

}


/* =========================================================
   CERRAR MODAL SERIES
========================================================= */

function cerrarModalSerie() {

    document.getElementById(
        "modalSerie"
    ).style.display =
        "none";


    serieActual =
        null;

    temporadaActual =
        null;


    nivelNavegacion =
        "principal";

}


/* =========================================================
   BACK
========================================================= */

function manejarBack() {

    /*
       1. SI ESTAMOS REPRODUCIENDO
       -----------------------------
       Cierra solamente el reproductor.
    */

    const reproductor =
        document.getElementById(
            "reproductor"
        );


    if (
        reproductor.style.display ===
        "flex"
    ) {

        cerrarReproductor();

        return;

    }


    /*
       2. SI ESTAMOS DENTRO DE UNA SERIE
       ----------------------------------
       Cerramos el modal de serie.
    */

    const modalSerie =
        document.getElementById(
            "modalSerie"
        );


    if (
        modalSerie.style.display ===
        "flex"
    ) {

        cerrarModalSerie();

        return;

    }


    /*
       3. SI ESTAMOS EN UNA CATEGORÍA
       --------------------------------
       Volvemos a TODAS.
    */

    if (
        nivelNavegacion ===
        "categoria"
    ) {

        categoriaActual =
            "TODAS";

        nivelNavegacion =
            "principal";

        cargarCategorias();

        mostrarPeliculas();

        return;

    }


    /*
       4. ESTAMOS EN EL MENÚ PRINCIPAL
       --------------------------------
       Salimos hacia TVArg.
    */

    volverTVArg();

}


/* =========================================================
   TVBACK — ANDROID / TV STICK
========================================================= */

/*
   ESTE es el mecanismo principal.

   Es exactamente el mismo evento
   que utiliza actualmente TVArg.
*/

window.addEventListener(
    "tvback",
    function() {

        manejarBack();

    }
);


/* =========================================================
   BACKUP PARA PC / NAVEGADOR
========================================================= */

/*
   En PC no existe tvback.

   Por eso mantenemos Escape y Back
   como respaldo.

   El TV Stick utilizará tvback.
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" ||
            event.key === "Back" ||
            event.keyCode === 4
        ) {

            event.preventDefault();

            manejarBack();

        }

    }
);


/* =========================================================
   INICIO
========================================================= */

cargarCategorias();

mostrarPeliculas();


/* =========================================================
   DETECTAR REGRESO DESDE TVARG
========================================================= */

/*
   No necesitamos hacer nada aquí todavía.

   El parámetro:

       ?desde=tvalc

   será utilizado por index.html para
   saltar directamente al menú principal.
*/

const parametros =
    new URLSearchParams(
        window.location.search
    );

const desdeTVArg =
    parametros.get("desde");


</script>
