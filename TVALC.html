<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TVArg - TV A LA CARTA</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================================================
   CABECERA
========================================================= */

header {

    padding: 20px;

    text-align: center;

    background:
        linear-gradient(
            to bottom,
            #181818,
            #090909
        );

    border-bottom: 1px solid #333;
}

header h1 {

    margin: 0;

    font-size: 28px;
}

header p {

    margin: 6px 0 0;

    color: #aaa;
}


/* =========================================================
   VOLVER A TVARG
========================================================= */

#volverTVArg {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 2000;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.65);

    color: white;

    font-size: 22px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: .2s;
}

#volverTVArg:hover {

    background:
        rgba(50,50,50,.9);

    transform: scale(1.08);
}


/* =========================================================
   ANDROID
========================================================= */

body.android-app #volverTVArg {

    display: none !important;
}


/* =========================================================
   BUSCADOR
========================================================= */

.buscador {

    padding:
        10px 15px 5px;

    display: flex;

    justify-content: center;

    min-height: 50px;
}


/*
   CONTROL VISUAL INICIAL
*/

#activarBusqueda {

    width:
        min(600px, 95%);

    padding:
        9px 14px;

    border-radius: 20px;

    border:
        1px solid #333;

    background: #151515;

    color: #aaa;

    font-size: 14px;

    text-align: left;

    outline: none;

    cursor: pointer;
}

#activarBusqueda:focus {

    border-color: #777;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.08);
}


/*
   INPUT REAL
*/

#buscar {

    display: none;

    width:
        min(600px, 95%);

    padding:
        9px 14px;

    border-radius: 20px;

    border:
        1px solid #333;

    background: #151515;

    color: white;

    font-size: 14px;

    outline: none;
}

#buscar:focus {

    border-color: #777;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.08);
}


/* =========================================================
   FILTROS
========================================================= */

.filtros {

    width: 100%;

    max-width: 1400px;

    margin: 0 auto;

    padding:
        3px 20px 10px;

    display: grid;

    grid-template-columns:
        minmax(180px, 1.7fr)
        minmax(115px, 1fr)
        minmax(115px, 1fr)
        minmax(150px, 1.2fr);

    gap: 7px;
}


/* =========================================================
   SELECT
========================================================= */

.filtro {

    width: 100%;

    height: 36px;

    padding:
        5px 30px 5px 10px;

    border:
        1px solid #333;

    border-radius: 6px;

    background: #151515;

    color: #ccc;

    font-size: 13px;

    outline: none;

    cursor: pointer;
}

.filtro:focus {

    border-color: #777;

    background: #202020;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.12);
}

.filtro:hover {

    background: #202020;
}


/* =========================================================
   FILTRO ACTIVO
========================================================= */

.filtro.activo {

    color: white;

    border-color: #555;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor {

    width: 100%;

    max-width: 1400px;

    margin: auto;

    padding:
        10px 20px 40px;
}


/* =========================================================
   TÍTULO DE RESULTADOS
========================================================= */

.tituloCategoria {

    font-size: 18px;

    color: #ccc;

    margin:
        8px 0 14px;
}


/* =========================================================
   PELÍCULAS
========================================================= */

.peliculas {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px, 1fr)
        );

    gap: 22px;
}


/* =========================================================
   TARJETA
========================================================= */

.pelicula {

    background: #111;

    border-radius: 8px;

    overflow: hidden;

    transition:
        transform .2s,
        box-shadow .2s;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    height: 100%;
}

.pelicula:hover {

    transform: scale(1.04);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.7);
}

.poster {

    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    display: block;

    background: #222;
}

.info {

    padding: 10px;

    display: flex;

    flex-direction: column;

    flex: 1;
}

.nombre {

    font-size: 15px;

    font-weight: bold;

    line-height: 1.25;
}

.año {

    color: #aaa;

    font-size: 13px;

    margin-top: auto;

    margin-bottom: 10px;
}

.ver {

    width: 100%;

    margin-top: 0;

    padding: 9px;

    border: none;

    border-radius: 5px;

    background: #e50914;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.ver:hover {

    background: #ff202b;
}


/* =========================================================
   REPRODUCTOR WEB
========================================================= */

#reproductor {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    background:
        rgba(0,0,0,.97);

    align-items: center;

    justify-content: center;

    flex-direction: column;
}

#video {

    width: 90%;

    max-width: 1100px;

    max-height: 80vh;

    background: black;
}

#tituloReproductor {

    margin: 10px;

    font-size: 20px;

    text-align: center;
}


/* =========================================================
   MENSAJE
========================================================= */

#mensajeReproductor {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 7000;

    width:
        min(90%, 500px);

    padding: 20px;

    border-radius: 10px;

    background:
        rgba(20,20,20,.95);

    border:
        1px solid #444;

    text-align: center;

    color: #ddd;
}


/* =========================================================
   MODAL SERIES
========================================================= */

#modalSeries {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    background:
        rgba(0,0,0,.94);

    align-items: center;

    justify-content: center;
}

#modalSeriesCaja {

    width:
        min(90%, 700px);

    max-height: 85vh;

    overflow-y: auto;

    background: #111;

    border:
        1px solid #333;

    border-radius: 14px;

    padding: 25px;
}

#modalSeriesTitulo {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 20px;
}


/* =========================================================
   TEMPORADAS
========================================================= */

.botonTemporada {

    width: 100%;

    margin:
        6px 0;

    padding: 13px;

    background: #222;

    color: white;

    border:
        1px solid #444;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

    text-align: left;
}

.botonTemporada:hover {

    background: #333;
}


/* =========================================================
   CAPÍTULOS
========================================================= */

.capitulos {

    display: none;

    margin:
        0 0 12px;
}

.botonCapitulo {

    width: 100%;

    margin:
        4px 0;

    padding: 10px;

    background: #191919;

    color: #ddd;

    border:
        1px solid #333;

    border-radius: 6px;

    text-align: left;

    cursor: pointer;
}

.botonCapitulo:hover {

    background: #292929;
}


/* =========================================================
   CANCELAR MODAL SERIES
========================================================= */

#cancelarSeries {

    width: 100%;

    margin-top: 18px;

    padding: 12px;

    border:
        1px solid #444;

    border-radius: 8px;

    background: #222;

    color: #ddd;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

#cancelarSeries:hover {

    background: #333;

    color: white;
}


/* =========================================================
   MÓVIL
========================================================= */

@media (max-width: 600px),
       (max-width: 800px) and (orientation: portrait) {

    header {

        padding:
            15px 10px;

        margin:
            8px 8px 0;

        border-radius:
            8px;
    }

    header h1 {

        font-size: 23px;
    }

    header p {

        font-size: 14px;
    }


    /* -----------------------------------------
       BUSCADOR
    ----------------------------------------- */

    .buscador {

        padding:
            8px 8px 4px;
    }

    #activarBusqueda,
    #buscar {

        width: 95%;

        padding:
            8px 12px;

        font-size: 13px;
    }


    /* -----------------------------------------
       FILTROS
    ----------------------------------------- */

    .filtros {

        width: 100%;

        padding:
            3px 14px 9px;

        margin: 0;

        grid-template-columns:
            1fr 1fr;

        gap: 6px;
    }

    .filtro {

        width: 100%;

        height: 35px;

        padding:
            5px 25px 5px 9px;

        font-size: 12px;

        border-radius: 6px;

        min-width: 0;
    }


    /* -----------------------------------------
       CONTENIDO
    ----------------------------------------- */

    .contenedor {

        padding:
            5px 14px 30px;
    }

    .tituloCategoria {

        font-size: 16px;

        margin:
            6px 0 12px;
    }


    /* -----------------------------------------
       TARJETAS
    ----------------------------------------- */

    .peliculas {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .nombre {

        font-size: 14px;
    }

    .año {

        font-size: 12px;
    }

    .ver {

        padding: 8px;

        font-size: 13px;
    }

}


/* =========================================================
   TV / WEBVIEW PEQUEÑO — HORIZONTAL
========================================================= */

@media (min-width: 601px) and (max-width: 1100px)
       and (orientation: landscape) {

    header {

        margin:
            12px 18px 0;

        padding:
            12px;

        border-radius:
            10px;
    }

    header h1 {

        font-size: 22px;
    }

    header p {

        font-size: 13px;
    }


    /* -----------------------------------------
       BUSCADOR
    ----------------------------------------- */

    .buscador {

        margin:
            8px 18px 0;

        padding:
            6px 8px 3px;
    }

    #activarBusqueda,
    #buscar {

        padding:
            7px 12px;

        font-size: 12px;
    }


    /* -----------------------------------------
       FILTROS
    ----------------------------------------- */

    .filtros {

        margin:
            0 18px;

        padding:
            2px 0 8px;

        width:
            calc(100% - 36px);

        grid-template-columns:
            1.7fr 1fr 1fr 1.2fr;

        gap: 5px;
    }

    .filtro {

        height: 32px;

        padding:
            4px 24px 4px 8px;

        font-size: 11px;

        border-radius: 5px;

        min-width: 0;
    }


    /* -----------------------------------------
       CONTENIDO
    ----------------------------------------- */

    .contenedor {

        padding:
            8px 28px 35px;
    }

    .tituloCategoria {

        font-size: 15px;

        margin:
            6px 0 10px;
    }


    /* -----------------------------------------
       TARJETAS
    ----------------------------------------- */

    .peliculas {

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(130px, 1fr)
            );

        gap: 12px;
    }

    .info {

        padding: 7px;
    }

    .nombre {

        font-size: 12px;
    }

    .año {

        font-size: 11px;
    }

    .ver {

        padding: 6px;

        margin-top: 6px;

        font-size: 11px;
    }

}


/* =========================================================
   ANDROID TV / TV STICK
   ---------------------------------------------------------
   IMPORTANTE:
   No depende del ancho de pantalla.

   El JS agrega:
       body.android-app

   Por lo tanto estos estilos funcionan incluso si
   el TV Stick informa 1280px, 1920px, etc.
========================================================= */

body.android-app header {

    margin:
        8px 18px 0;

    padding:
        9px 12px;

    border-radius:
        8px;
}

body.android-app header h1 {

    font-size: 20px;

    line-height: 1.1;
}

body.android-app header p {

    margin-top: 3px;

    font-size: 12px;
}


/* -----------------------------------------
   BUSCADOR TV STICK
----------------------------------------- */

body.android-app .buscador {

    margin:
        5px 18px 0;

    padding:
        4px 0 3px;

    min-height: 0;
}

body.android-app #activarBusqueda,
body.android-app #buscar {

    width:
        100%;

    max-width:
        650px;

    padding:
        7px 12px;

    font-size:
        12px;

    border-radius:
        18px;
}


/* -----------------------------------------
   FILTROS TV STICK
----------------------------------------- */

body.android-app .filtros {

    margin:
        0 18px;

    padding:
        2px 0 6px;

    width:
        calc(100% - 36px);

    max-width:
        none;

    grid-template-columns:
        minmax(180px, 1.7fr)
        minmax(100px, 1fr)
        minmax(100px, 1fr)
        minmax(130px, 1.2fr);

    gap:
        5px;
}

body.android-app .filtro {

    height:
        31px;

    padding:
        3px 22px 3px 8px;

    font-size:
        11px;

    border-radius:
        5px;
}


/* -----------------------------------------
   CONTENIDO TV STICK
----------------------------------------- */

body.android-app .contenedor {

    max-width:
        none;

    padding:
        5px 28px 25px;
}

body.android-app .tituloCategoria {

    font-size:
        14px;

    margin:
        5px 0 9px;

    color:
        #bbb;
}


/* -----------------------------------------
   TARJETAS TV STICK
----------------------------------------- */

body.android-app .peliculas {

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(125px, 1fr)
        );

    gap:
        10px;
}

body.android-app .pelicula {

    border-radius:
        6px;
}

body.android-app .info {

    padding:
        6px;
}

body.android-app .nombre {

    font-size:
        12px;

    line-height:
        1.2;
}

body.android-app .año {

    font-size:
        10px;

    margin-bottom:
        6px;
}

body.android-app .ver {

    padding:
        6px;

    font-size:
        10px;

    border-radius:
        4px;
}


/* -----------------------------------------
   MODAL SERIES TV STICK
----------------------------------------- */

body.android-app #modalSeriesCaja {

    width:
        min(80%, 600px);

    max-height:
        82vh;

    padding:
        18px;

    border-radius:
        10px;
}

body.android-app #modalSeriesTitulo {

    font-size:
        18px;

    margin-bottom:
        12px;
}

body.android-app .botonTemporada {

    margin:
        4px 0;

    padding:
        9px;

    font-size:
        13px;

    border-radius:
        6px;
}

body.android-app .botonCapitulo {

    margin:
        3px 0;

    padding:
        7px;

    font-size:
        12px;

    border-radius:
        5px;
}

body.android-app #cancelarSeries {

    margin-top:
        12px;

    padding:
        9px;

    font-size:
        12px;

    border-radius:
        6px;
}


/* -----------------------------------------
   MENSAJE TV STICK
----------------------------------------- */

body.android-app #mensajeReproductor {

    width:
        min(70%, 450px);

    padding:
        15px;

    font-size:
        13px;
}


/* -----------------------------------------
   REPRODUCTOR TV STICK
----------------------------------------- */

body.android-app #tituloReproductor {

    margin:
        7px;

    font-size:
        16px;
}

body.android-app #video {

    width:
        92%;

    max-width:
        1000px;

    max-height:
        82vh;
}


/* =========================================================
   TV STICK MUY ANCHO
   Reduce aún más las tarjetas si el WebView informa
   una resolución grande.
========================================================= */

@media (min-width: 1400px) {

    body.android-app .peliculas {

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(125px, 145px)
            );

        justify-content:
            start;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     VOLVER A TVARG
===================================================== -->

<button
    id="volverTVArg"
    onclick="volverTVArg()"
    title="Volver a TVArg">

    ←

</button>


<!-- =====================================================
     CABECERA
===================================================== -->

<header>

    <h1>
        🎬 TV A LA CARTA
    </h1>

    <p>
        Películas y series
    </p>

</header>


<!-- =====================================================
     BUSCADOR
===================================================== -->

<div class="buscador">

    <button
        id="activarBusqueda"
        type="button">

        🔎 Buscar película o serie...

    </button>


    <input
        type="text"
        id="buscar"
        placeholder="🔎 Buscar película o serie..."
        autocomplete="off"
        oninput="filtrar">

</div>


<!-- =====================================================
     FILTROS
===================================================== -->

<div
    class="filtros"
    id="filtros">


    <!-- CATEGORÍA -->

    <select
        id="filtroCategoria"
        class="filtro"
        aria-label="Categoría">

        <option value="TODAS">
            TODAS
        </option>

        <option value="Acción">
            Acción
        </option>

        <option value="Aventura">
            Aventura
        </option>

        <option value="Comedia">
            Comedia
        </option>

        <option value="Infantil">
            Infantil
        </option>

        <option value="Drama">
            Drama
        </option>

        <option value="Ciencia ficción">
            Ciencia ficción
        </option>

        <option value="Fantasía">
            Fantasía
        </option>

        <option value="Terror">
            Terror
        </option>

        <option value="Suspenso">
            Suspenso
        </option>

        <option value="Romance">
            Romance
        </option>

        <option value="Crimen">
            Crimen
        </option>

        <option value="Documental">
            Documental
        </option>

        <option value="Historia">
            Historia
        </option>

        <option value="Musical">
            Musical
        </option>

        <option value="Bélica">
            Bélica
        </option>

        <option value="Western">
            Western
        </option>

    </select>


    <!-- DESDE -->

    <select
        id="filtroDesde"
        class="filtro"
        aria-label="Desde">

    </select>


    <!-- HASTA -->

    <select
        id="filtroHasta"
        class="filtro"
        aria-label="Hasta">

    </select>


    <!-- TIPO -->

    <select
        id="filtroTipo"
        class="filtro"
        aria-label="Tipo">

        <option value="TODAS">
            TODAS
        </option>

        <option value="peliculas">
            PELÍCULAS
        </option>

        <option value="series">
            SERIES
        </option>

    </select>

</div>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<div class="contenedor">

    <div
        class="tituloCategoria"
        id="tituloCategoria">

        TODAS

    </div>

    <div
        class="peliculas"
        id="peliculas">
    </div>

</div>


<!-- =====================================================
     REPRODUCTOR WEB
===================================================== -->

<div id="reproductor">

    <div
        id="tituloReproductor">
    </div>

    <video
        id="video"
        controls
        autoplay
        playsinline>
    </video>

</div>


<!-- =====================================================
     MENSAJE
===================================================== -->

<div id="mensajeReproductor">

    <div id="textoMensaje"></div>

</div>


<!-- =====================================================
     MODAL SERIES
===================================================== -->

<div id="modalSeries">

    <div id="modalSeriesCaja">

        <div id="modalSeriesTitulo">
            SERIE
        </div>

        <div id="contenidoSeries"></div>

        <button
            id="cancelarSeries"
            onclick="cerrarSeries()">

            CANCELAR

        </button>

    </div>

</div>


<!-- =====================================================
     DATOS
===================================================== -->

<script src="libreria/TVALCp01.js"></script>
<script src="libreria/TVALCp02.js"></script>
<script src="libreria/TVALCp03.js"></script>
<script src="libreria/TVALCp04.js"></script>
<script src="libreria/TVALCp05.js"></script>
<script src="libreria/TVALCp06.js"></script>

<script src="libreria/TVALCs01.js"></script>
<script src="libreria/TVALCs02.js"></script>


<script>

/* =========================================================
   DATOS TV A LA CARTA
========================================================= */

const peliculas =
    window.TVALC_PELICULAS || [];

const series =
    window.TVALC_SERIES || [];


/* =========================================================
   DETECTAR ANDROID TVARG
========================================================= */

const esAndroidTVArg =
    !!window.AndroidTVArg;

if (esAndroidTVArg) {

    document.body.classList.add(
        "android-app"
    );

}


/* =========================================================
   ESTADO
========================================================= */

let reproductorAbierto =
    false;

let reproduccionNativa =
    false;

let busquedaActiva =
    false;


/* =========================================================
   AÑO ACTUAL
========================================================= */

const añoActual =
    new Date().getFullYear();


/* =========================================================
   ELEMENTOS DEL BUSCADOR
========================================================= */

const botonActivarBusqueda =
    document.getElementById(
        "activarBusqueda"
    );

const inputBuscar =
    document.getElementById(
        "buscar"
    );


/* =========================================================
   ELEMENTOS DE FILTROS
========================================================= */

const filtroCategoria =
    document.getElementById(
        "filtroCategoria"
    );

const filtroDesde =
    document.getElementById(
        "filtroDesde"
    );

const filtroHasta =
    document.getElementById(
        "filtroHasta"
    );

const filtroTipo =
    document.getElementById(
        "filtroTipo"
    );


/* =========================================================
   CARGAR AÑOS
========================================================= */

function cargarAños() {

    const añosDatos = [

        ...peliculas,
        ...series

    ]
        .map(
            elemento =>
                parseInt(
                    elemento.año,
                    10
                )
        )
        .filter(
            año =>
                !isNaN(año)
        );


    /*
       Últimos 5 años incluyendo
       el año actual.

       En 2026:
       2022, 2023, 2024, 2025, 2026
    */

    const añoInicial =
        añoActual - 4;


    const añoMasAntiguo =
        añosDatos.length
            ? Math.min(...añosDatos)
            : añoInicial;


    const añoMinimo =
        Math.min(
            añoMasAntiguo,
            añoInicial
        );


    filtroDesde.innerHTML =
        "";

    filtroHasta.innerHTML =
        "";


    /*
       DESDE
    */

    for (
        let año = añoMinimo;
        año <= añoActual;
        año++
    ) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            año;

        option.textContent =
            año;

        filtroDesde.appendChild(
            option
        );

    }


    /*
       HASTA
    */

    for (
        let año = añoActual;
        año >= añoMinimo;
        año--
    ) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            año;

        option.textContent =
            año;

        filtroHasta.appendChild(
            option
        );

    }


    /*
       VALORES PREDETERMINADOS

       Últimos 5 años:
       2022 → 2026
    */

    filtroDesde.value =
        añoInicial;

    filtroHasta.value =
        añoActual;

}


/* =========================================================
   ACTUALIZAR ESTADO VISUAL DE FILTROS
========================================================= */

function actualizarEstadoFiltros() {

    filtroCategoria.classList.toggle(
        "activo",
        filtroCategoria.value !== "TODAS"
    );


    filtroDesde.classList.toggle(
        "activo",
        parseInt(
            filtroDesde.value,
            10
        ) !== añoActual - 4
    );


    filtroHasta.classList.toggle(
        "activo",
        parseInt(
            filtroHasta.value,
            10
        ) !== añoActual
    );


    filtroTipo.classList.toggle(
        "activo",
        filtroTipo.value !== "TODAS"
    );

}


/* =========================================================
   CAMBIO DE FILTROS
========================================================= */

function cambiarFiltros() {

    let desde =
        parseInt(
            filtroDesde.value,
            10
        );

    let hasta =
        parseInt(
            filtroHasta.value,
            10
        );


    /*
       Si Desde supera Hasta,
       corregimos automáticamente.
    */

    if (
        desde > hasta
    ) {

        filtroHasta.value =
            desde;

    }


    actualizarEstadoFiltros();

    mostrarContenido();

}


/* =========================================================
   ACTIVAR BUSCADOR
========================================================= */

function activarCampoBusqueda() {

    if (busquedaActiva) {

        return;

    }


    busquedaActiva =
        true;


    botonActivarBusqueda.style.display =
        "none";


    inputBuscar.style.display =
        "block";


    inputBuscar.focus();

}


/* =========================================================
   DESACTIVAR BUSCADOR
========================================================= */

function desactivarBusqueda() {

    if (!busquedaActiva) {

        return false;

    }


    inputBuscar.blur();


    inputBuscar.style.display =
        "none";


    inputBuscar.value =
        "";


    botonActivarBusqueda.style.display =
        "block";


    busquedaActiva =
        false;


    mostrarContenido();


    return true;

}


/* =========================================================
   ACTIVAR CON MOUSE / TÁCTIL
========================================================= */

botonActivarBusqueda.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        activarCampoBusqueda();

    }
);


/* =========================================================
   CONTROL OK / ENTER DEL BUSCADOR
========================================================= */

botonActivarBusqueda.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === "OK" ||
            event.keyCode === 13 ||
            event.keyCode === 23 ||
            event.keyCode === 66
        ) {

            event.preventDefault();

            event.stopPropagation();

            activarCampoBusqueda();

        }

    }
);


/* =========================================================
   EVENTOS DE FILTROS
========================================================= */

filtroCategoria.addEventListener(
    "change",
    cambiarFiltros
);

filtroDesde.addEventListener(
    "change",
    cambiarFiltros
);

filtroHasta.addEventListener(
    "change",
    cambiarFiltros
);

filtroTipo.addEventListener(
    "change",
    cambiarFiltros
);


/* =========================================================
   VOLVER A TVARG
========================================================= */

function volverTVArg() {

    window.location.href =
        "index.html?desdeTVALC=1";

}


/* =========================================================
   MOSTRAR CONTENIDO
========================================================= */

function mostrarContenido() {

    const contenedor =
        document.getElementById(
            "peliculas"
        );

    const titulo =
        document.getElementById(
            "tituloCategoria"
        );


    /*
       BÚSQUEDA
    */

    const busqueda =
        inputBuscar.value
            .toLowerCase()
            .trim();


    /*
       FILTROS
    */

    const categoria =
        filtroCategoria.value;

    const desde =
        parseInt(
            filtroDesde.value,
            10
        );

    const hasta =
        parseInt(
            filtroHasta.value,
            10
        );

    const tipo =
        filtroTipo.value;


    /*
       UNIFICAMOS PELÍCULAS Y SERIES.
    */

    let lista = [

        ...peliculas.map(
            pelicula => ({
                ...pelicula,
                _esSerie: false
            })
        ),

        ...series.map(
            serie => ({
                ...serie,
                _esSerie: true
            })
        )

    ];


    /* =====================================================
       FILTRO CATEGORÍA
    ===================================================== */

    if (
        categoria !==
        "TODAS"
    ) {

        lista =
            lista.filter(
                elemento => {

                    let categoriaElemento =
                        elemento.categoria;


                    /*
                       Compatibilidad con
                       "SERIES DE TERROR".
                    */

                    if (
                        categoriaElemento &&
                        categoriaElemento
                            .toUpperCase()
                            .trim() ===
                        "SERIES DE TERROR"
                    ) {

                        categoriaElemento =
                            "TERROR";

                    }


                    return (
                        categoriaElemento ===
                        categoria
                    );

                }
            );

    }


    /* =====================================================
       FILTRO DESDE / HASTA
    ===================================================== */

    lista =
        lista.filter(
            elemento => {

                const año =
                    parseInt(
                        elemento.año,
                        10
                    );


                if (
                    isNaN(año)
                ) {

                    return false;

                }


                return (
                    año >= desde &&
                    año <= hasta
                );

            }
        );


    /* =====================================================
       FILTRO TIPO
    ===================================================== */

    if (
        tipo ===
        "peliculas"
    ) {

        lista =
            lista.filter(
                elemento =>
                    !elemento._esSerie
            );

    }


    if (
        tipo ===
        "series"
    ) {

        lista =
            lista.filter(
                elemento =>
                    elemento._esSerie
            );

    }


    /* =====================================================
       FILTRO BÚSQUEDA
    ===================================================== */

    if (busqueda) {

        lista =
            lista.filter(
                elemento =>
                    elemento.titulo &&
                    elemento.titulo
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
            );

    }


    /* =====================================================
       CANTIDAD
    ===================================================== */

    const total =
        lista.length;


    /* =====================================================
       TÍTULO
    ===================================================== */

    const textoCategoria =
        categoria === "TODAS"
            ? "TODAS"
            : categoria;


    const textoTipo =

        tipo === "TODAS"
            ? "TODAS"
            : tipo === "peliculas"
                ? "PELÍCULAS"
                : "SERIES";


    titulo.textContent =

        textoCategoria +

        "  •  " +

        desde +

        "–" +

        hasta +

        "  •  " +

        textoTipo +

        "  •  " +

        total +

        " títulos";


    /* =====================================================
       LIMPIAR
    ===================================================== */

    contenedor.innerHTML =
        "";


    /* =====================================================
       SIN RESULTADOS
    ===================================================== */

    if (
        total === 0
    ) {

        contenedor.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#888;
            ">

                No se encontraron
                películas o series.

            </div>

        `;

        return;

    }


    /* =====================================================
       MOSTRAR RESULTADOS
    ===================================================== */

    lista.forEach(
        elemento => {

            crearTarjeta(
                elemento,
                elemento._esSerie
            );

        }
    );

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjeta(
    elemento,
    esSerie
) {

    const contenedor =
        document.getElementById(
            "peliculas"
        );


    const tarjeta =
        document.createElement(
            "div"
        );


    tarjeta.className =
        "pelicula";


    tarjeta.innerHTML = `

        <img
            class="poster"
            src="${elemento.poster}"
            loading="lazy"
            onerror="
                this.style.opacity='.3'
            "
        >

        <div class="info">

            <div class="nombre">

                ${elemento.titulo}

            </div>

            <div class="año">

                ${elemento.año}

            </div>

            <button class="ver">

                ${esSerie
                    ? "▶ SERIE"
                    : "▶ VER"}

            </button>

        </div>

    `;


    tarjeta
        .querySelector(
            ".ver"
        )
        .onclick = event => {

            event.stopPropagation();


            if (esSerie) {

                abrirSerie(
                    elemento
                );

            } else {

                reproducir(
                    elemento
                );

            }

        };


    tarjeta.onclick =
        () => {

            if (esSerie) {

                abrirSerie(
                    elemento
                );

            } else {

                reproducir(
                    elemento
                );

            }

        };


    contenedor.appendChild(
        tarjeta
    );

}


/* =========================================================
   BÚSQUEDA
========================================================= */

function filtrar() {

    mostrarContenido();

}


/* =========================================================
   REPRODUCIR
========================================================= */

function reproducir(
    pelicula
) {

    const url =
        pelicula.url
            .split("?")[0]
            .toLowerCase();


    /* ==========================================
       VLC NATIVO
       TV A LA CARTA
    ========================================== */

    if (
        url.endsWith(".mkv") ||
        url.endsWith(".mp4") ||
        url.endsWith(".avi") ||
        url.endsWith(".m3u8")
    ) {

        console.log(
            "TV A LA CARTA → VLC TVALC:",
            pelicula.titulo,
            pelicula.url
        );


        if (
            window.AndroidTVArg &&
            typeof AndroidTVArg.playChannelTVALC ===
            "function"
        ) {

            AndroidTVArg.playChannelTVALC(
                pelicula.url,
                pelicula.titulo
            );

            return;

        }


        console.log(
            "AndroidTVArg no disponible"
        );


        mostrarMensaje(
            "El reproductor nativo no está disponible."
        );

        return;

    }


    /* ==========================================
       OTROS → HTML
    ========================================== */

    const reproductor =
        document.getElementById(
            "reproductor"
        );

    const video =
        document.getElementById(
            "video"
        );


    document.getElementById(
        "tituloReproductor"
    ).textContent =

        pelicula.titulo +

        " (" +

        pelicula.año +

        ")";


    video.src =
        pelicula.url;


    reproductor.style.display =
        "flex";


    reproductorAbierto =
        true;

    reproduccionNativa =
        false;


    video.play().catch(
        () => {}
    );

}


/* =========================================================
   REPRODUCCIÓN ANDROID — TVARG / EXOPLAYER
========================================================= */

function reproducirEnAndroid(
    pelicula
) {

    console.log(
        "TVALC -> AndroidTVArg.playChannel:",
        pelicula.titulo,
        pelicula.url
    );


    if (!window.AndroidTVArg) {

        console.error(
            "TVArgBridge no está disponible"
        );


        reproductorAbierto =
            false;

        reproduccionNativa =
            false;


        mostrarMensaje(
            "TVArgBridge no está disponible."
        );


        return;

    }


    try {

        AndroidTVArg.playChannel(
            pelicula.url,
            "",
            ""
        );

    } catch (error) {

        console.error(
            "Error iniciando PlayerActivity:",
            error
        );


        reproductorAbierto =
            false;

        reproduccionNativa =
            false;


        mostrarMensaje(
            "No se pudo iniciar el reproductor."
        );

    }

}


/* =========================================================
   REPRODUCCIÓN WEB
========================================================= */

function reproducirWeb(
    pelicula
) {

    const reproductor =
        document.getElementById(
            "reproductor"
        );


    const video =
        document.getElementById(
            "video"
        );


    document.getElementById(
        "tituloReproductor"
    ).textContent =

        pelicula.titulo +

        " (" +

        pelicula.año +

        ")";


    video.src =
        pelicula.url;


    reproductor.style.display =
        "flex";


    reproductorAbierto =
        true;

    reproduccionNativa =
        false;


    video.play()
        .catch(
            error => {

                console.log(
                    "Autoplay bloqueado:",
                    error
                );

            }
        );

}


/* =========================================================
   MANEJAR SALIDA DEL PLAYER NATIVO
========================================================= */

function manejarSalidaCanal() {

    console.log(
        "PlayerActivity finalizada -> TVALC"
    );


    reproductorAbierto =
        false;


    reproduccionNativa =
        false;

}


/* =========================================================
   CERRAR REPRODUCTOR WEB
========================================================= */

function cerrarReproductor() {

    const reproductor =
        document.getElementById(
            "reproductor"
        );


    const video =
        document.getElementById(
            "video"
        );


    video.pause();


    video.removeAttribute(
        "src"
    );


    video.load();


    reproductor.style.display =
        "none";


    reproductorAbierto =
        false;

}


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
    texto
) {

    const caja =
        document.getElementById(
            "mensajeReproductor"
        );


    const contenido =
        document.getElementById(
            "textoMensaje"
        );


    contenido.textContent =
        texto;


    caja.style.display =
        "block";


    setTimeout(
        () => {

            caja.style.display =
                "none";

        },
        3500
    );

}


/* =========================================================
   SERIES
========================================================= */

function abrirSerie(
    serie
) {

    const modal =
        document.getElementById(
            "modalSeries"
        );


    const titulo =
        document.getElementById(
            "modalSeriesTitulo"
        );


    const contenido =
        document.getElementById(
            "contenidoSeries"
        );


    titulo.textContent =
        serie.titulo;


    contenido.innerHTML =
        "";


    if (
        !serie.temporadas ||
        serie.temporadas.length === 0
    ) {

        contenido.innerHTML = `

            <div style="
                text-align:center;
                padding:30px;
                color:#888;
            ">

                No hay capítulos
                disponibles.

            </div>

        `;


        modal.style.display =
            "flex";


        return;

    }


    serie.temporadas.forEach(
        temporada => {

            const botonTemporada =
                document.createElement(
                    "button"
                );


            botonTemporada.className =
                "botonTemporada";


            botonTemporada.textContent =

                "▶ Temporada " +

                temporada.numero;


            const capitulos =
                document.createElement(
                    "div"
                );


            capitulos.className =
                "capitulos";


            temporada.capitulos.forEach(
                capitulo => {

                    const botonCapitulo =
                        document.createElement(
                            "button"
                        );


                    botonCapitulo.className =
                        "botonCapitulo";


                    botonCapitulo.textContent =

                        "▶ " +

                        (
                            capitulo.titulo ||
                            "Capítulo " +
                            capitulo.numero
                        );


                    botonCapitulo.onclick =
                        () => {

                            cerrarSeries();


                            reproducir(
                                {

                                    titulo:
                                        serie.titulo +

                                        " - T" +

                                        temporada.numero +

                                        "E" +

                                        capitulo.numero,

                                    año:
                                        serie.año,

                                    url:
                                        capitulo.url

                                }
                            );

                        };


                    capitulos.appendChild(
                        botonCapitulo
                    );

                }
            );


            botonTemporada.onclick =
                () => {

                    if (
                        capitulos.style.display ===
                        "block"
                    ) {

                        capitulos.style.display =
                            "none";

                    } else {

                        capitulos.style.display =
                            "block";

                    }

                };


            contenido.appendChild(
                botonTemporada
            );


            contenido.appendChild(
                capitulos
            );

        }
    );


    modal.style.display =
        "flex";

}


/* =========================================================
   CERRAR SERIES
========================================================= */

function cerrarSeries() {

    document.getElementById(
        "modalSeries"
    ).style.display =
        "none";

}


/* =========================================================
   BACK ANDROID
========================================================= */

window.addEventListener(
    "tvback",
    () => {

        console.log(
            "TVBACK recibido en TVALC"
        );


        /* ================================================
           1. BUSCADOR ACTIVO
        ================================================= */

        if (busquedaActiva) {

            desactivarBusqueda();

            return;

        }


        /* ================================================
           2. MODAL DE SERIES
        ================================================= */

        const modalSeries =
            document.getElementById(
                "modalSeries"
            );


        if (
            modalSeries.style.display ===
            "flex"
        ) {

            cerrarSeries();

            return;

        }


        /* ================================================
           3. REPRODUCTOR WEB
        ================================================= */

        if (
            reproductorAbierto &&
            !reproduccionNativa
        ) {

            cerrarReproductor();

            return;

        }


        /* ================================================
           4. PANTALLA PRINCIPAL TVALC
        ================================================= */

        volverTVArg();

    }
);


/* =========================================================
   BACK TECLADO — PC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" ||
            event.key === "Back" ||
            event.keyCode === 4
        ) {

            event.preventDefault();


            /* ============================================
               BUSCADOR
            ============================================ */

            if (busquedaActiva) {

                desactivarBusqueda();

                return;

            }


            /* ============================================
               REPRODUCTOR WEB
            ============================================ */

            if (
                reproductorAbierto &&
                !reproduccionNativa
            ) {

                cerrarReproductor();

                return;

            }


            /* ============================================
               MODAL SERIES
            ============================================ */

            const modalSeries =
                document.getElementById(
                    "modalSeries"
                );


            if (
                modalSeries.style.display ===
                "flex"
            ) {

                cerrarSeries();

                return;

            }


            /* ============================================
               PRINCIPAL TVALC
            ============================================ */

            volverTVArg();

        }

    }
);


/* =========================================================
   CERRAR MODAL SERIES AL TOCAR FONDO
========================================================= */

document.getElementById(
    "modalSeries"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            cerrarSeries();

        }

    }
);


/* =========================================================
   MANEJAR ERRORES DEL VIDEO WEB
========================================================= */

document.getElementById(
    "video"
).addEventListener(
    "error",
    function() {

        mostrarMensaje(
            "No se pudo reproducir este contenido."
        );

    }
);


/* =========================================================
   INICIO
========================================================= */

cargarAños();

actualizarEstadoFiltros();

mostrarContenido();

</script>
